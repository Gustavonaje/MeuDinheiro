<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c">
<meta name="description" content="Controle de gastos, metas, cartões e quem me deve — funciona sem internet.">
<title>Meu dinheiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu dinheiro">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#eef1f3;
  --surface:#ffffff;
  --surface-2:#f6f8f9;
  --ink:#10171c;
  --ink-2:#4f5d66;
  --ink-3:#7d8b94;
  --line:#dde4e8;
  --line-2:#eaeff1;

  --brand:#0f4c5c;
  --brand-2:#156b80;
  --on-brand:#ffffff;

  --pos:#157f5a;   --pos-bg:#e3f2eb;   --on-pos:#fff;
  --neg:#b3402c;   --neg-bg:#fae9e5;   --on-neg:#fff;
  --res:#946013;   --res-bg:#f9efd9;   --on-res:#fff;
  --com:#5b53c4;   --com-bg:#eceafa;   --on-com:#fff;
  --rec:#8a3fae;   --rec-bg:#f3e8f8;   --on-rec:#fff;

  --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(16,23,28,.05);
  --shadow-lg:0 10px 30px -14px rgba(16,23,28,.35);
  --nav-w:236px;
  --tap:44px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1316; --surface:#161d21; --surface-2:#1c2429;
    --ink:#e9eef1; --ink-2:#a6b4bc; --ink-3:#78868e;
    --line:#273137; --line-2:#1f282d;
    --brand:#5fc3cf; --brand-2:#86d6df; --on-brand:#06282f;
    --pos:#4fc395; --pos-bg:#12271f; --on-pos:#06251a;
    --neg:#e8836b; --neg-bg:#2a1a16; --on-neg:#2a1109;
    --res:#dcae52; --res-bg:#271f12; --on-res:#241a05;
    --com:#9b93ef; --com-bg:#1d1b33; --on-com:#12102b;
    --rec:#c48ade; --rec-bg:#271a2e; --on-rec:#2a0f36;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 10px 30px -14px rgba(0,0,0,.8);
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{overflow-x:clip}
body{overflow-x:clip}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.012em}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .res{color:var(--res)}
.com{color:var(--com)} .rec{color:var(--rec)} .mut{color:var(--ink-3)}

/* ---------------- shell ---------------- */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{flex:1;padding:16px;padding-bottom:104px;max-width:1180px;width:100%;margin:0 auto}

.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.topbar-in{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1180px;margin:0 auto}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--on-brand);
  display:grid;place-items:center;font-size:12.5px;font-weight:800;flex:none}

.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.iconbtn svg{width:18px;height:18px}

/* desktop sidebar */
@media (min-width:1024px){
  .side{
    display:flex;flex-direction:column;width:var(--nav-w);flex:none;
    background:var(--surface);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px;
  }
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .side-brand b{font-size:15px;font-weight:750;letter-spacing:-.02em}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    font-size:14px;font-weight:600;color:var(--ink-2)}
  .side-link svg{width:18px;height:18px;flex:none}
  .side-link:hover{background:var(--surface-2);color:var(--ink)}
  .side-link[aria-current="page"]{background:var(--brand);color:var(--on-brand)}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-2)}
  .side-total{padding:10px;border-radius:var(--r);background:var(--surface-2)}
  .side-total .v{font-size:19px;font-weight:750;letter-spacing:-.025em;margin-top:2px}
  .content{padding:22px 28px;padding-bottom:40px}
  .iconbtn{width:36px;height:36px;border-radius:9px}
  .topbar-in{padding:14px 28px}
  .topbar h1{font-size:21px}
  .botnav,.fab{display:none!important}
  .logo-mobile{display:none}
}

/* mobile nav */
.botnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.botnav-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:620px;margin:0 auto}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;
  color:var(--ink-3);font-size:10px;font-weight:650}
.navbtn svg{width:20px;height:20px}
.navbtn[aria-current="page"]{color:var(--brand)}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:41;
  width:54px;height:54px;border-radius:17px;background:var(--brand);color:var(--on-brand);
  display:grid;place-items:center;box-shadow:var(--shadow-lg)}
.fab svg{width:24px;height:24px}
.fab{transition:transform .22s ease,opacity .18s ease}
.fab.oculto{transform:translateY(96px) scale(.9);opacity:0;pointer-events:none}

/* ---------------- blocos ---------------- */
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid > *{min-width:0}
@media (min-width:900px){
  .grid-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h2{font-size:14px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:0}
.card-head > *{min-width:0}
.link{font-size:12.5px;font-weight:650;color:var(--brand);
  display:inline-flex;align-items:center;min-height:36px;margin-block:-9px;flex:none}

/* hero patrimônio + barra de composição */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--shadow)}
.hero-v{font-size:36px;font-weight:780;letter-spacing:-.035em;line-height:1.05;margin:6px 0 0}
@media (min-width:1024px){.hero-v{font-size:42px}}
.comp{display:flex;height:30px;border-radius:8px;overflow:hidden;margin-top:18px;
  background:var(--surface-2);border:1px solid var(--line-2)}
.comp-seg{min-width:2px;transition:filter .15s}
.comp-seg:hover{filter:brightness(1.12)}
.comp-legend{display:grid;gap:8px;margin-top:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.comp-legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.comp-legend{grid-template-columns:repeat(4,minmax(0,1fr))}}
.leg{display:flex;align-items:flex-start;gap:8px;text-align:left;width:100%}
.leg .sw{width:10px;height:10px;border-radius:3px;flex:none;margin-top:5px}
.leg .n{font-size:12px;color:var(--ink-2);font-weight:600;display:block}
.leg .v{font-size:15px;font-weight:720;display:block;margin-top:1px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tiles > *{min-width:0}
.tiles-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:559px){
  .tiles-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles-3 > :last-child:nth-child(3){grid-column:1 / -1}
}
@media (min-width:900px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;text-align:left;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--ink-3)}
.tile .l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  display:flex;align-items:center;gap:5px}
.tile .l svg{width:12px;height:12px}
.tile .v{font-size:19px;font-weight:740;letter-spacing:-.025em;margin-top:5px}
.tile .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* listas e tabelas */
.rows{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.row{display:flex;align-items:center;gap:12px;padding:11px 13px;width:100%;text-align:left;
  border-bottom:1px solid var(--line-2);min-height:var(--tap)}
.rows .row:last-child{border-bottom:0}
button.row:hover{background:var(--surface-2)}
.row-ic{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff}
.row-ic svg{width:15px;height:15px}
.row-mid{flex:1;min-width:0}
.row-t{font-size:14px;font-weight:620;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.row-s{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
.row-v{font-size:14.5px;font-weight:700;flex:none;white-space:nowrap}

.daygroup{margin-top:16px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 3px 6px}
.dayhead .d{font-size:12px;font-weight:700;color:var(--ink-2)}
.dayhead .d::first-letter{text-transform:uppercase}
.dayhead .t{font-size:12px;color:var(--ink-3)}

.tbl-rola{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
@media (max-width:420px){
  table.tbl{font-size:12.5px}
  .tbl th,.tbl td{padding:8px 7px}
  .tbl th:first-child,.tbl td:first-child{padding-left:2px}
  .tbl th:last-child,.tbl td:last-child{padding-right:2px}
}
@media (max-width:380px){
  .topbar-nuvem .nuvem-pill span{display:none}
  .topbar-nuvem .nuvem-pill{padding:0;border-radius:999px;
    width:38px;height:38px;justify-content:center}
}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .r{text-align:right}
.tbl .clickable{cursor:pointer}

/* barras */
.bar{display:flex;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line-2)}
.bar span{display:block;height:100%;border-radius:99px;flex:none}
.bar span.proj{background:repeating-linear-gradient(135deg,var(--rec) 0 5px,color-mix(in srgb,var(--rec) 55%,transparent) 5px 10px)}
.meta-linha{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;
  color:var(--ink-3);margin-top:7px}
.meta-linha > *{min-width:0}
@media (max-width:559px){
  .meta-linha{display:grid;grid-template-columns:1fr;gap:2px}
  .btn-nova{width:100%}
}
.catlinha{display:block;width:100%;padding:7px 2px;margin-bottom:3px;border-radius:8px}
.catlinha:hover{background:var(--surface-2)}
.minibars{display:flex;gap:3px;height:7px}
.minibars span{border-radius:99px}

/* ---------------- agenda: linha com ação do lado ---------------- */
.ag-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line-2);background:var(--surface)}
.rows .ag-row:last-child{border-bottom:0}
.ag-abrir{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:12px 13px;text-align:left}
.ag-abrir:hover{background:var(--surface-2)}
.ag-mid{flex:1;min-width:0}
.ag-acao{flex:none;width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border-left:1px solid var(--line-2);background:var(--com-bg);color:var(--com);
  font-size:11px;font-weight:750;letter-spacing:-.01em}
.ag-acao svg{width:17px;height:17px}
.ag-acao:hover{filter:brightness(.95)}
.ag-acao.a-com{background:var(--com-bg);color:var(--com)}
.ag-acao.a-pos{background:var(--pos-bg);color:var(--pos)}
.ag-acao.a-res{background:var(--res-bg);color:var(--res)}
.ag-acao.a-neg{background:var(--neg-bg);color:var(--neg)}
.ag-resumo .ag-n{font-size:19px;font-weight:760;letter-spacing:-.03em;margin-top:2px}
.ag-resumo .hint{margin-top:2px}
.ag-botoes{margin:14px 0 4px}
.ag-mes{display:flex;justify-content:flex-start;margin-bottom:12px}
.selmes{display:flex;align-items:center;gap:4px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:3px}
.selmes .seta{border:0;background:none;width:38px;height:38px}
.selmes .rotulo{min-width:112px;text-align:center;font-size:13.5px;font-weight:650}
.selmes .rotulo::first-letter{text-transform:uppercase}
@media (min-width:1024px){ .selmes .seta{width:34px;height:34px} }
.ag-composicao{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-2);
  font-size:12.5px;color:var(--ink-3)}
.ag-composicao b{color:var(--ink-2);font-weight:700}
.secao-ag{margin-top:26px}
.secao-ag h2{font-size:14px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
.card.destaque{border-color:var(--res);box-shadow:0 0 0 3px var(--res-bg),var(--shadow)}

/* ---------------- atalhos de registro ---------------- */
.atalhos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.atalho{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;
  padding:13px 6px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);
  font-size:12px;font-weight:680;color:var(--ink);line-height:1.2;text-align:center;min-height:82px}
.atalho:hover{border-color:var(--ink-3);background:var(--surface)}
.atalho .at-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.atalho .at-ic svg{width:17px;height:17px}
.atalho.a-neg .at-ic{background:var(--neg-bg);color:var(--neg)}
.atalho.a-pos .at-ic{background:var(--pos-bg);color:var(--pos)}
.atalho.a-com .at-ic{background:var(--com-bg);color:var(--com)}
.atalho.a-res .at-ic{background:var(--res-bg);color:var(--res)}
@media (max-width:420px){
  .atalhos{gap:7px}
  .atalho{font-size:11.5px;padding:11px 4px;min-height:76px}
}

/* chips e tags */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0}
.chip{flex:none;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:620;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag svg{width:11px;height:11px}
.t-pos{background:var(--pos-bg);color:var(--pos)}
.t-neg{background:var(--neg-bg);color:var(--neg)}
.t-res{background:var(--res-bg);color:var(--res)}
.t-com{background:var(--com-bg);color:var(--com)}
.t-rec{background:var(--rec-bg);color:var(--rec)}
.t-mut{background:var(--surface-2);color:var(--ink-3)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 17px;
  border-radius:var(--r);font-weight:680;font-size:14px;border:1px solid transparent}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-2)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn-danger{background:var(--neg-bg);color:var(--neg)}
.btn-block{width:100%}
.btn-sm{height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* estados */
.empty{text-align:center;padding:30px 18px}
.empty-ic{width:46px;height:46px;border-radius:13px;background:var(--surface-2);display:grid;
  place-items:center;margin:0 auto 11px;color:var(--ink-3)}
.empty-ic svg{width:22px;height:22px}
.empty h3{font-size:15px;font-weight:700;margin:0 0 4px}
.empty p{font-size:13.5px;color:var(--ink-3);margin:0 auto;max-width:330px}
.empty .btn{margin-top:14px}
.note{border-radius:var(--r);padding:11px 13px;font-size:13px;line-height:1.5;margin-top:12px}
.note b{font-weight:700}
.note-res{background:var(--res-bg);color:var(--res)}
.note-com{background:var(--com-bg);color:var(--com)}
.note-neg{background:var(--neg-bg);color:var(--neg)}
.note-mut{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* kv */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:650;text-align:right}

/* ---------------- painel lateral / modal ---------------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(10,16,20,.5);opacity:0;visibility:hidden;
  transition:opacity .18s ease,visibility .18s;display:flex;align-items:flex-end;justify-content:center}
.scrim.open{opacity:1;visibility:visible}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;
  overflow-y:auto;overscroll-behavior:contain;
  border-radius:20px 20px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(12px);transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.scrim.open .sheet{transform:translateY(0)}
@media (min-width:720px){
  .scrim{align-items:center}
  .sheet{border-radius:16px;max-height:88vh;max-height:88dvh;padding:6px 22px 22px}
  .sheet.wide{max-width:760px}
}
.grabber{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 10px}
@media (min-width:720px){.grabber{display:none}}
.sheet-head{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.sheet-head h2{font-size:17px;font-weight:720;margin:0;letter-spacing:-.02em;flex:1}
.sheet-actions{display:flex;gap:9px;margin-top:18px;position:sticky;bottom:0;z-index:3;
  background:var(--surface);padding:12px 0 2px;
  box-shadow:0 -10px 14px -10px rgba(16,23,28,.18)}
.sheet-actions .btn{flex:1;min-width:0}
@media (min-width:720px){.sheet-actions{box-shadow:none;padding-bottom:0}}

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="config.js"></script>
<script>
/* =============================================================
   MOTOR FINANCEIRO — Meu Dinheiro v2
   -------------------------------------------------------------
   Toda regra de negócio vive aqui. As telas só leem o que este
   arquivo calcula; nenhuma tela refaz conta por fora.

   PRINCÍPIO: o razão (DB.mov) é a única fonte de verdade.
   Empréstimos, faturas e reposições NÃO guardam saldo próprio —
   seus saldos são derivados dos movimentos que apontam para eles.
   Isso torna impossível os dois lados discordarem.

   TIPOS DE MOVIMENTO e seus efeitos
   ---------------------------------------------------------------------------
   tipo                    saldo da conta   patrimônio  vira despesa?  vira receita?
   ---------------------------------------------------------------------------
   receita                 + conta          sobe        não            SIM
   despesa (à vista)       − conta          desce       SIM            não
   despesa (no cartão)     não mexe         igual       SIM (na        não
                                                        competência
                                                        da parcela)
   transferencia           − origem         igual       não            não
                           + destino
   emprestimo_concedido    − conta          desce       não (vira      não
                                                        "a receber")
   recebimento_emprestimo  + conta          sobe        não            não (é
                                                        devolução)
   emprestimo_obtido       + conta          sobe        não            não (vira
                                                        dívida)
   pagamento_emprestimo    − conta          desce       não            não
   perda_emprestimo        não mexe         igual       SIM            não
   pagamento_fatura        − conta          desce       não (a compra  não
                                                        já contou)
   ajuste                  ± conta          ±           não            não
   ---------------------------------------------------------------------------

   INDICADORES (sem dupla contagem)
     patrimonio   = soma dos saldos de todas as contas
     reservado    = soma das metas (conta vinculada → saldo; manual → aportes)
     comprometido = faturas em aberto + despesas previstas não realizadas
     aReceber     = empréstimos concedidos ainda não devolvidos
     aPagar       = empréstimos obtidos ainda não devolvidos
     aRepor       = retiradas de reserva ainda não repostas (INFORMATIVO:
                    não desconta do disponível, pois o saque já derrubou o
                    saldo da conta e, por consequência, a meta)
     disponivel   = patrimonio − reservado − comprometido − aPagar

   POR QUE NÃO DUPLICA
     Compra no cartão: patrimônio não muda, fatura sobe → disponível desce.
     Pagamento da fatura: patrimônio desce, fatura some → disponível igual.
     O gasto entrou uma vez só, na competência da parcela.
   ============================================================= */

var Fin = (function () {
'use strict';

/* ---------- utilidades de dinheiro (centavos inteiros) ---------- */
function cents(v){ return Math.round(Number(v) || 0); }
function fmt(c, opts){
  opts = opts || {};
  var neg = c < 0, a = Math.abs(Math.round(c || 0));
  var i = Math.floor(a/100).toString(), d = String(a%100).padStart(2,'0');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  var s = (opts.nosymbol ? '' : 'R$ ') + i + ',' + d;
  if (neg) s = '-' + s;
  else if (opts.plus && a > 0) s = '+' + s;
  return s;
}
function digitsToCents(str){
  var d = String(str == null ? '' : str).replace(/\D/g,'');
  return d ? parseInt(d.slice(0,12), 10) : 0;
}

/* ---------- utilidades de data ---------- */
var MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function toISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fromISO(s){
  var p = String(s||'').split('-');
  return new Date(+p[0], (+p[1]||1)-1, +p[2]||1);
}
function hojeISO(){ return toISO(new Date()); }
function mesKey(iso){ return String(iso||'').slice(0,7); }
function mesAtual(){ return mesKey(hojeISO()); }
function addMeses(mk, n){
  var p = String(mk).split('-'), d = new Date(+p[0], (+p[1])-1+n, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function diffMeses(a, b){
  var pa = a.split('-'), pb = b.split('-');
  return (+pb[0] - +pa[0]) * 12 + (+pb[1] - +pa[1]);
}
/* dia seguro: 31 de fevereiro vira o último dia do mês */
function diaNoMes(mk, dia){
  var p = mk.split('-'), ano = +p[0], mes = +p[1]-1;
  var ultimo = new Date(ano, mes+1, 0).getDate();
  return toISO(new Date(ano, mes, Math.min(dia, ultimo)));
}
function fimDoMes(mk){
  var p = mk.split('-');
  return toISO(new Date(+p[0], +p[1], 0));
}
function mesLabel(mk, curto){
  var p = String(mk).split('-');
  var m = (curto ? MES_C : MES)[(+p[1])-1] || '';
  return m + (curto ? '/' + p[0].slice(2) : ' de ' + p[0]);
}
function dataCurta(iso){
  var d = fromISO(iso);
  return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + d.getFullYear();
}
function diasEntre(a, b){ return Math.round((fromISO(b) - fromISO(a)) / 86400000); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- paleta ---------- */
var PAL = ['#c0562f','#c68a24','#8a9a2b','#3f8f6b','#2e7d9a','#4b5fa6','#7e5aa6','#b24a72','#9a6a45','#5f7a6e','#a8443f','#417f8a'];

var CAT_DESPESA = [
  ['Moradia',0],['Mercado',3],['Alimentação fora',1],['Transporte',4],['Contas de casa',9],
  ['Saúde',7],['Educação',5],['Lazer',6],['Compras',8],['Assinaturas',11],
  ['Cuidados pessoais',2],['Pets',10],['Presentes',7],['Impostos e taxas',9],
  ['Juros e tarifas',0],['Perda com empréstimo',10],['Outros',10]
];
var CAT_RECEITA = [
  ['Salário',3],['Trabalho extra',4],['Reembolso',9],['Venda',1],
  ['Rendimentos',2],['Presente recebido',7],['Outros',10]
];

/* ---------- estado ---------- */
var DB = null;

function novoBanco(){
  return {
    v: 2,
    criadoEm: new Date().toISOString(),
    contas: [],
    cartoes: [],
    mov: [],
    previstos: [],
    metas: [],
    emprestimos: [],
    reposicoes: [],
    categorias: {
      despesa: CAT_DESPESA.map(function(c){ return { nome:c[0], cor:PAL[c[1]] }; }),
      receita: CAT_RECEITA.map(function(c){ return { nome:c[0], cor:PAL[c[1]] }; })
    },
    config: { ultimaConta:'', moeda:'R$' }
  };
}

function setDB(d){ DB = d; return DB; }
function getDB(){ return DB; }

/* =============================================================
   MIGRAÇÃO v1 → v2 (não destrutiva)
   O v1 guardava: contas{uso}, lancamentos{entrada,saida,guardado,
   resgate,transferencia}, previstos{saida,entrada,reposicao},
   metas{aportes,contasVinculadas}, devedores{pagamentos}.
   ============================================================= */
function migrarV1(velho){
  var novo = novoBanco();
  novo.migradoDe = 'v1';
  novo.criadoEm = velho.criadoEm || novo.criadoEm;

  // contas: uso 'guardar' → tipo 'reserva'
  novo.contas = (velho.contas || []).map(function(c){
    return {
      id: c.id, nome: c.nome,
      tipo: c.uso === 'guardar' ? 'reserva' : 'corrente',
      saldoInicial: cents(c.saldoInicial), dataInicial: '',
      referencia: cents(c.referencia), cor: c.cor || PAL[4], arquivada: false
    };
  });
  if (!novo.contas.length) {
    novo.contas = [{ id:'conta-principal', nome:'Conta principal', tipo:'corrente',
      saldoInicial:0, dataInicial:'', referencia:0, cor:PAL[4], arquivada:false }];
  }

  // categorias
  if (velho.categorias && velho.categorias.saida) {
    novo.categorias.despesa = velho.categorias.saida.slice();
    novo.categorias.receita = (velho.categorias.entrada || novo.categorias.receita).slice();
  }
  ['Perda com empréstimo','Juros e tarifas'].forEach(function(n){
    if (!novo.categorias.despesa.some(function(c){ return c.nome === n; })) {
      novo.categorias.despesa.push({ nome:n, cor:PAL[10] });
    }
  });

  // metas
  novo.metas = (velho.metas || []).map(function(m){
    return {
      id:m.id, nome:m.nome, descricao:m.obs || '', alvo:cents(m.alvo), prazo:m.prazo || '',
      contasVinculadas:(m.contasVinculadas||[]).slice(),
      aportes:(m.aportes||[]).map(function(a){
        return { id:a.id||uid(), valor:cents(a.valor), data:a.data, obs:a.obs||'', retirada:!!a.resgate };
      }),
      criadaEm:m.criadaEm || new Date().toISOString()
    };
  });

  // devedores → empréstimos concedidos (metadados) + movimentos
  var lancPorId = {};
  (velho.lancamentos || []).forEach(function(l){ if (l.id) lancPorId[l.id] = l; });
  var contaPadraoId = novo.contas[0] ? novo.contas[0].id : '';
  /* a saída original "Emprestei para alguém" sabe de qual conta o dinheiro saiu;
     sem isso o saldo da conta ficaria alto demais depois da migração */
  function contaDoEmprestimo(d){
    var achou = (velho.lancamentos || []).filter(function(l){
      return l.tipo === 'saida' && l.categoria === 'Emprestei para alguém' &&
             l.valor === d.valor && l.data === d.data;
    })[0];
    return (achou && achou.contaId) || contaPadraoId;
  }
  (velho.devedores || []).forEach(function(d){
    var eid = d.id;
    novo.emprestimos.push({
      id:eid, direcao:'concedido', pessoa:d.nome, descricao:d.motivo || '',
      prazo:d.prazo || '', criadoEm:d.criadoEm || new Date().toISOString()
    });
    // o v1 já tinha a saída lançada como despesa "Emprestei para alguém";
    // aqui ela vira o movimento de empréstimo, sem duplicar
    novo.mov.push({
      id:uid(), tipo:'emprestimo_concedido', valor:cents(d.valor), data:d.data,
      contaId:contaDoEmprestimo(d), emprestimoId:eid, descricao:'Emprestei para ' + d.nome,
      obs:d.motivo || '', criadoEm:d.criadoEm || new Date().toISOString(), migrado:true
    });
    (d.pagamentos || []).forEach(function(p){
      var orig = p.lancId ? lancPorId[p.lancId] : null;
      novo.mov.push({
        id:uid(), tipo:'recebimento_emprestimo', valor:cents(p.valor), data:p.data,
        contaId:(orig && orig.contaId) || contaPadraoId, emprestimoId:eid, descricao:d.nome + ' devolveu',
        obs:p.obs || '', criadoEm:new Date().toISOString(), migrado:true,
        v1LancId:p.lancId || ''
      });
    });
  });

  // lançamentos
  var idsIgnorar = {};
  (velho.devedores || []).forEach(function(d){
    (d.pagamentos||[]).forEach(function(p){ if (p.lancId) idsIgnorar[p.lancId] = 1; });
  });

  (velho.lancamentos || []).forEach(function(l){
    // entradas que já viraram recebimento de empréstimo não entram de novo
    if (idsIgnorar[l.id]) return;
    // a saída antiga "Emprestei para alguém" já virou emprestimo_concedido
    if (l.tipo === 'saida' && l.categoria === 'Emprestei para alguém') return;

    var base = {
      id:l.id || uid(), valor:cents(l.valor), data:l.data,
      descricao:l.descricao || '', obs:l.justificativa || '',
      categoria:l.categoria || '', forma:l.forma || '',
      criadoEm:l.criadoEm || new Date().toISOString(), migrado:true
    };
    if (l.tipo === 'entrada') {
      novo.mov.push(Object.assign(base, { tipo:'receita', contaId:l.contaId || '' }));
    } else if (l.tipo === 'saida') {
      novo.mov.push(Object.assign(base, { tipo:'despesa', contaId:l.contaId || '' }));
    } else if (l.tipo === 'transferencia') {
      novo.mov.push(Object.assign(base, {
        tipo:'transferencia',
        contaOrigemId: l.contaOrigemId || '', contaDestinoId: l.contaDestinoId || '',
        metaOrigemId: l.metaOrigemId || '', metaDestinoId: l.metaDestinoId || ''
      }));
    }
    // 'guardado' e 'resgate' eram etiquetas de meta: viram aportes, que já
    // foram migrados acima junto com a meta. Não entram no razão.
  });

  // previstos
  (velho.previstos || []).forEach(function(p){
    if (p.tipo === 'reposicao') {
      /* o buraco agora é calculado sozinho pelo patamar da conta;
         o registro manual vira apenas garantia de que a conta é acompanhada */
      var cr = novo.contas.filter(function(c){ return c.id === p.contaDestinoId; })[0];
      if (cr) cr.acompanharNivel = true;
    } else {
      novo.previstos.push({
        id:p.id, tipo:p.tipo === 'entrada' ? 'receita' : 'despesa', valor:cents(p.valor),
        vencimento:p.vencimento, categoria:p.categoria || '', descricao:p.descricao || '',
        obs:p.justificativa || '', repete:p.repete || '', contaId:'', cartaoId:'',
        criadoEm:p.criadoEm || new Date().toISOString()
      });
    }
  });

  return novo;
}

/* ---------- normalização defensiva ---------- */
function normalizar(d){
  var base = novoBanco();
  if (!d || typeof d !== 'object') return base;
  if (d.v === 1 || (d.lancamentos && !d.mov)) return normalizar(migrarV1(d));

  var out = Object.assign(base, d);
  function arr(x){ return Array.isArray(x) ? x : []; }

  out.contas = arr(d.contas).filter(function(c){ return c && c.id && c.nome; });
  out.contas.forEach(function(c){
    c.saldoInicial = cents(c.saldoInicial);
    c.referencia = cents(c.referencia);
    if (['corrente','reserva','investimento'].indexOf(c.tipo) < 0) c.tipo = 'corrente';
    if (typeof c.acompanharNivel !== 'boolean') c.acompanharNivel = (c.tipo === 'reserva' || c.tipo === 'investimento');
    if (c.nivelReset && c.nivelReset.data) c.nivelReset.valor = cents(c.nivelReset.valor);
    else c.nivelReset = null;
    c.cor = c.cor || PAL[4];
  });
  if (!out.contas.length) {
    out.contas = [{ id:'conta-principal', nome:'Conta principal', tipo:'corrente',
      saldoInicial:0, dataInicial:'', referencia:0, cor:PAL[4], arquivada:false }];
  }

  out.cartoes = arr(d.cartoes).filter(function(c){ return c && c.id && c.nome; });
  out.cartoes.forEach(function(c){
    c.limite = cents(c.limite);
    c.diaFechamento = Math.min(28, Math.max(1, parseInt(c.diaFechamento,10) || 1));
    c.diaVencimento = Math.min(28, Math.max(1, parseInt(c.diaVencimento,10) || 10));
    c.cor = c.cor || PAL[6];
  });

  out.mov = arr(d.mov).filter(function(m){
    return m && m.id && m.tipo && typeof m.valor === 'number' && m.data;
  });
  out.mov.forEach(function(m){ m.valor = cents(m.valor); });

  out.previstos = arr(d.previstos).filter(function(p){ return p && p.id && p.vencimento; });
  out.previstos.forEach(function(p){ p.valor = cents(p.valor); });

  out.metas = arr(d.metas).filter(function(m){ return m && m.id; });
  out.metas.forEach(function(m){
    m.alvo = cents(m.alvo);
    m.aportes = arr(m.aportes);
    m.contasVinculadas = arr(m.contasVinculadas);
    /* null = nunca escolhido; false = o usuário desligou de propósito */
    if (typeof m.incluirAReceber !== 'boolean') m.incluirAReceber = null;
  });
  /* só uma meta conta a projeção, senão o mesmo dinheiro apareceria duas vezes */
  var jaConta = 0;
  out.metas.forEach(function(m){
    if (m.incluirAReceber === true) { if (jaConta) m.incluirAReceber = false; else jaConta = 1; }
  });
  /* ninguém escolhido ainda? liga na primeira meta, para a projeção aparecer sem configuração */
  if (!jaConta) {
    for (var im = 0; im < out.metas.length; im++) {
      if (out.metas[im].incluirAReceber === null) { out.metas[im].incluirAReceber = true; break; }
    }
  }
  out.metas.forEach(function(m){ m.incluirAReceber = m.incluirAReceber === true; });
  // uma conta alimenta no máximo uma meta
  var usadas = {};
  out.metas.forEach(function(m){
    m.contasVinculadas = m.contasVinculadas.filter(function(id){
      if (usadas[id]) return false;
      if (!out.contas.some(function(c){ return c.id === id; })) return false;
      usadas[id] = 1; return true;
    });
  });

  out.emprestimos = arr(d.emprestimos).filter(function(e){ return e && e.id; });
  out.reposicoes = arr(d.reposicoes).filter(function(r){ return r && r.id; });
  out.reposicoes.forEach(function(r){ r.valor = cents(r.valor); });

  if (!out.categorias || !Array.isArray(out.categorias.despesa)) out.categorias = base.categorias;
  if (!out.config) out.config = base.config;
  return out;
}

/* =============================================================
   CONSULTAS BÁSICAS
   ============================================================= */
function conta(id){
  for (var i=0;i<DB.contas.length;i++) if (DB.contas[i].id === id) return DB.contas[i];
  return null;
}
function cartao(id){
  for (var i=0;i<DB.cartoes.length;i++) if (DB.cartoes[i].id === id) return DB.cartoes[i];
  return null;
}
function emprestimo(id){
  for (var i=0;i<DB.emprestimos.length;i++) if (DB.emprestimos[i].id === id) return DB.emprestimos[i];
  return null;
}
function meta(id){
  for (var i=0;i<DB.metas.length;i++) if (DB.metas[i].id === id) return DB.metas[i];
  return null;
}
function categoria(tipo, nome){
  var lista = DB.categorias[tipo === 'receita' ? 'receita' : 'despesa'] || [];
  for (var i=0;i<lista.length;i++) if (lista[i].nome === nome) return lista[i];
  return { nome: nome || 'Sem categoria', cor:'#8a938e' };
}

/* ---------- efeito de um movimento no saldo de uma conta ---------- */
function efeitoNaConta(m, contaId){
  switch (m.tipo) {
    case 'receita':
    case 'recebimento_emprestimo':
    case 'emprestimo_obtido':
      return m.contaId === contaId ? m.valor : 0;
    case 'despesa':
      // despesa no cartão não toca em conta nenhuma até a fatura ser paga
      if (m.cartaoId) return 0;
      return m.contaId === contaId ? -m.valor : 0;
    case 'emprestimo_concedido':
    case 'pagamento_emprestimo':
    case 'pagamento_fatura':
      return m.contaId === contaId ? -m.valor : 0;
    case 'transferencia':
      var s = 0;
      if (m.contaDestinoId === contaId) s += m.valor;
      if (m.contaOrigemId === contaId) s -= m.valor;
      return s;
    case 'ajuste':
      return m.contaId === contaId ? m.valor : 0; // valor com sinal
    case 'perda_emprestimo':
      return 0; // reconhece a perda, não move dinheiro
    default:
      return 0;
  }
}
function saldoConta(c, ateISO){
  if (typeof c === 'string') c = conta(c);
  if (!c) return 0;
  var s = c.saldoInicial || 0;
  for (var i=0;i<DB.mov.length;i++) {
    var m = DB.mov[i];
    if (ateISO && m.data > ateISO) continue;
    s += efeitoNaConta(m, c.id);
  }
  return s;
}
function patrimonio(ateISO){
  return DB.contas.reduce(function(s,c){ return s + saldoConta(c, ateISO); }, 0);
}

/* =============================================================
   CARTÕES, FATURAS E PARCELAS
   Uma compra parcelada é guardada UMA vez. As parcelas são
   calculadas, nunca duplicadas no banco.
   ============================================================= */
function competenciaDaCompra(cart, dataISO){
  var d = fromISO(dataISO);
  var mk = mesKey(dataISO);
  // comprou depois do fechamento? cai na fatura seguinte
  return d.getDate() > cart.diaFechamento ? addMeses(mk, 1) : mk;
}
function vencimentoFatura(cart, competencia){
  // vence no mês da competência se o vencimento é depois do fechamento;
  // caso contrário, no mês seguinte
  var mk = cart.diaVencimento > cart.diaFechamento ? competencia : addMeses(competencia, 1);
  return diaNoMes(mk, cart.diaVencimento);
}
/* divide o valor em n parcelas sem perder centavos */
function valorParcela(total, n, k){
  var base = Math.floor(total / n);
  var resto = total - base * n;
  return base + (k <= resto ? 1 : 0); // o resto vai nas primeiras parcelas
}
/* todas as parcelas de uma compra */
function parcelasDaCompra(m){
  var cart = cartao(m.cartaoId);
  if (!cart) return [];
  var n = Math.max(1, parseInt(m.parcelas,10) || 1);
  var base = competenciaDaCompra(cart, m.data);
  var out = [];
  for (var k = 1; k <= n; k++) {
    out.push({
      movId: m.id, cartaoId: cart.id, numero: k, total: n,
      competencia: addMeses(base, k-1),
      valor: valorParcela(m.valor, n, k),
      descricao: m.descricao, categoria: m.categoria, dataCompra: m.data
    });
  }
  return out;
}
function comprasDoCartao(cartaoId){
  return DB.mov.filter(function(m){ return m.tipo === 'despesa' && m.cartaoId === cartaoId; });
}
function parcelasDaFatura(cartaoId, competencia){
  var out = [];
  comprasDoCartao(cartaoId).forEach(function(m){
    parcelasDaCompra(m).forEach(function(p){
      if (p.competencia === competencia) out.push(p);
    });
  });
  return out;
}
function pagamentosDaFatura(cartaoId, competencia){
  return DB.mov.filter(function(m){
    return m.tipo === 'pagamento_fatura' && m.cartaoId === cartaoId && m.competencia === competencia;
  });
}
function fatura(cartaoId, competencia){
  var cart = cartao(cartaoId);
  if (!cart) return null;
  var ps = parcelasDaFatura(cartaoId, competencia);
  var total = ps.reduce(function(s,p){ return s + p.valor; }, 0);
  var pago = pagamentosDaFatura(cartaoId, competencia).reduce(function(s,m){ return s + m.valor; }, 0);
  var venc = vencimentoFatura(cart, competencia);
  var hoje = hojeISO();
  return {
    cartaoId: cartaoId, competencia: competencia, parcelas: ps,
    total: total, pago: pago, aberto: Math.max(0, total - pago),
    vencimento: venc,
    fechada: diaNoMes(competencia, cart.diaFechamento) < hoje,
    vencida: total > pago && venc < hoje,
    quitada: total > 0 && pago >= total
  };
}
/* todas as competências que têm parcela ou pagamento */
function competenciasDoCartao(cartaoId){
  var set = {};
  comprasDoCartao(cartaoId).forEach(function(m){
    parcelasDaCompra(m).forEach(function(p){ set[p.competencia] = 1; });
  });
  pagamentosDaFatura && DB.mov.forEach(function(m){
    if (m.tipo === 'pagamento_fatura' && m.cartaoId === cartaoId) set[m.competencia] = 1;
  });
  return Object.keys(set).sort();
}
function faturasAbertas(cartaoId){
  return competenciasDoCartao(cartaoId).map(function(mk){ return fatura(cartaoId, mk); })
    .filter(function(f){ return f.aberto > 0; });
}
function totalFaturasAbertas(){
  return DB.cartoes.reduce(function(s,c){
    return s + faturasAbertas(c.id).reduce(function(t,f){ return t + f.aberto; }, 0);
  }, 0);
}
function limiteUsado(cartaoId){
  // o que já foi comprado e ainda não foi pago
  return faturasAbertas(cartaoId).reduce(function(s,f){ return s + f.aberto; }, 0);
}

/* =============================================================
   EMPRÉSTIMOS (nos dois sentidos) — saldo derivado do razão
   ============================================================= */
function movsDoEmprestimo(id){
  return DB.mov.filter(function(m){ return m.emprestimoId === id; });
}
function saldoEmprestimo(e){
  if (typeof e === 'string') e = emprestimo(e);
  if (!e) return 0;
  var principal = 0, baixado = 0;
  movsDoEmprestimo(e.id).forEach(function(m){
    if (m.tipo === 'emprestimo_concedido' || m.tipo === 'emprestimo_obtido') principal += m.valor;
    else if (m.tipo === 'recebimento_emprestimo' || m.tipo === 'pagamento_emprestimo' || m.tipo === 'perda_emprestimo') baixado += m.valor;
  });
  return Math.max(0, principal - baixado);
}
function emprestimosPorDirecao(dir){
  return DB.emprestimos.filter(function(e){ return e.direcao === dir; });
}
function totalAReceber(){
  return emprestimosPorDirecao('concedido').reduce(function(s,e){ return s + saldoEmprestimo(e); }, 0);
}
function totalAPagarPessoas(){
  return emprestimosPorDirecao('obtido').reduce(function(s,e){ return s + saldoEmprestimo(e); }, 0);
}

/* =============================================================
   PATAMAR DAS RESERVAS (marca d'água)
   O nível de uma conta de reserva é o MAIOR saldo que ela já teve.
   Nada é digitado: tirou dinheiro, abre um buraco igual ao que saiu;
   depositou acima do nível, o nível sobe sozinho e o buraco fecha.

   Exemplo: 5.000 na conta → nível 5.000.
   Saca 2.000  → saldo 3.000, falta repor 2.000.
   Repõe 2.000 → saldo 5.000, falta 0, nível segue 5.000.
   Deposita 5.000 em vez disso → saldo 8.000, nível vira 8.000, falta 0.

   "Redefinir patamar" grava um marco novo, para quando a reserva foi
   gasta de propósito e você não quer mais ser cobrado por ela.
   A reposição NÃO desconta do disponível: o saque já baixou o saldo.
   ============================================================= */
function movsDaConta(c){
  return DB.mov.filter(function(m){ return efeitoNaConta(m, c.id) !== 0; })
    .sort(function(a,b){
      if (a.data === b.data) return String(a.criadoEm||'').localeCompare(String(b.criadoEm||''));
      return a.data.localeCompare(b.data);
    });
}
function acompanhaNivel(c){
  if (!c) return false;
  if (typeof c.acompanharNivel === 'boolean') return c.acompanharNivel;
  return c.tipo === 'reserva' || c.tipo === 'investimento';
}
function nivelConta(c){
  if (typeof c === 'string') c = conta(c);
  if (!c) return { nivel:0, saldo:0, falta:0, acompanha:false, desde:'' };
  var reset = (c.nivelReset && c.nivelReset.data) ? c.nivelReset : null;
  var saldo = c.saldoInicial || 0;
  var nivel = reset ? cents(reset.valor) : saldo;
  movsDaConta(c).forEach(function(m){
    saldo += efeitoNaConta(m, c.id);
    if (!reset || m.data >= reset.data) nivel = Math.max(nivel, saldo);
  });
  var acompanha = acompanhaNivel(c);
  return {
    nivel: nivel, saldo: saldo,
    falta: acompanha ? Math.max(0, nivel - saldo) : 0,
    acompanha: acompanha, desde: reset ? reset.data : ''
  };
}
function contasComNivel(){
  return DB.contas.filter(function(c){ return acompanhaNivel(c); });
}
function totalARepor(){
  return contasComNivel().reduce(function(s,c){ return s + nivelConta(c).falta; }, 0);
}
function contasARepor(){
  return contasComNivel().filter(function(c){ return nivelConta(c).falta > 0; });
}

/* =============================================================
   METAS
   ============================================================= */
function metaVinculada(m){ return !!(m.contasVinculadas && m.contasVinculadas.length); }
function contasDaMeta(m){ return (m.contasVinculadas||[]).map(conta).filter(Boolean); }
function metaDaConta(contaId){
  for (var i=0;i<DB.metas.length;i++) {
    if ((DB.metas[i].contasVinculadas||[]).indexOf(contaId) >= 0) return DB.metas[i];
  }
  return null;
}
function metaAcumulado(m){
  if (metaVinculada(m)) {
    return contasDaMeta(m).reduce(function(s,c){ return s + saldoConta(c); }, 0);
  }
  return (m.aportes||[]).reduce(function(s,a){ return s + (a.retirada ? -a.valor : a.valor); }, 0);
}
function totalReservado(){
  return DB.metas.reduce(function(s,m){ return s + metaAcumulado(m); }, 0);
}
/* soma das projeções — uma única meta por vez pode contar o a receber */
function totalAReceberNasMetas(){
  return DB.metas.reduce(function(s,m){ return s + metaAReceber(m); }, 0);
}
/* Projeção, NÃO patrimônio: o que está emprestado ainda não voltou.
   Serve só para enxergar onde a meta chegaria se todos pagassem.
   Nunca entra em indicadores(), em patrimônio nem no disponível. */
function metaAReceber(m){
  return m && m.incluirAReceber ? totalAReceber() : 0;
}
function metaProgresso(m){
  var acc = metaAcumulado(m);
  var alvo = m.alvo || 0;
  var falta = Math.max(0, alvo - acc);
  var pc = alvo > 0 ? Math.min(100, acc/alvo*100) : 0;
  var rec = metaAReceber(m);
  var accProj = acc + rec;
  var pcProj = alvo > 0 ? Math.min(100, accProj/alvo*100) : 0;
  var porMes = 0, mesesRestantes = 0;
  if (alvo > 0 && m.prazo) {
    var dias = diasEntre(hojeISO(), m.prazo);
    mesesRestantes = Math.max(1, Math.ceil(dias/30));
    if (dias > 0) porMes = Math.ceil(falta / mesesRestantes);
  }
  return { acumulado:acc, alvo:alvo, falta:falta, percentual:pc,
           aReceber:rec, comReceber:accProj, percentualComReceber:pcProj,
           faltaComReceber:Math.max(0, alvo - accProj),
           porMes:porMes, mesesRestantes:mesesRestantes,
           concluida: alvo > 0 && falta === 0, semAlvo: !alvo };
}

/* =============================================================
   PREVISTOS (ainda não aconteceram)
   Previsto de cartão não entra aqui: já está na fatura.
   ============================================================= */
function previstosAbertos(){
  return DB.previstos.slice().sort(function(a,b){ return a.vencimento.localeCompare(b.vencimento); });
}
function totalPrevisto(tipo){
  return DB.previstos.reduce(function(s,p){
    return (p.tipo || 'despesa') === tipo ? s + p.valor : s;
  }, 0);
}

/* =============================================================
   INDICADORES — o painel inteiro sai daqui
   ============================================================= */
function indicadores(){
  var pat = patrimonio();
  var res = totalReservado();
  var faturas = totalFaturasAbertas();
  var prev = totalPrevisto('despesa');
  var comprometido = faturas + prev;
  var aRec = totalAReceber();
  var aPag = totalAPagarPessoas();
  var aRep = totalARepor();
  return {
    patrimonio: pat,
    reservado: res,
    faturasAbertas: faturas,
    previstos: prev,
    comprometido: comprometido,
    aReceber: aRec,
    aPagarPessoas: aPag,
    aRepor: aRep,
    disponivel: pat - res - comprometido - aPag,
    // sinaliza quando as metas prometem mais do que existe em conta
    reservadoExcede: res > pat
  };
}

/* =============================================================
   RELATÓRIOS
   Regra de reconhecimento da despesa:
     à vista  → na data do movimento
     cartão   → na competência de CADA parcela
   O pagamento da fatura nunca vira despesa.
   ============================================================= */
function despesasNoPeriodo(deISO, ateISO){
  var out = [];
  DB.mov.forEach(function(m){
    if (m.tipo === 'despesa') {
      if (m.cartaoId) {
        parcelasDaCompra(m).forEach(function(p){
          var dataRef = fimDoMes(p.competencia);
          var dataIni = diaNoMes(p.competencia, 1);
          if (dataRef >= deISO && dataIni <= ateISO) {
            out.push({ movId:m.id, data:dataRef, competencia:p.competencia, valor:p.valor,
              categoria:m.categoria, descricao:m.descricao + ' (' + p.numero + '/' + p.total + ')',
              cartaoId:m.cartaoId, contaId:'' });
          }
        });
      } else if (m.data >= deISO && m.data <= ateISO) {
        out.push({ movId:m.id, data:m.data, competencia:mesKey(m.data), valor:m.valor,
          categoria:m.categoria, descricao:m.descricao, cartaoId:'', contaId:m.contaId });
      }
    } else if (m.tipo === 'perda_emprestimo' && m.data >= deISO && m.data <= ateISO) {
      out.push({ movId:m.id, data:m.data, competencia:mesKey(m.data), valor:m.valor,
        categoria:'Perda com empréstimo', descricao:m.descricao, cartaoId:'', contaId:'' });
    }
  });
  return out;
}
function receitasNoPeriodo(deISO, ateISO){
  return DB.mov.filter(function(m){
    return m.tipo === 'receita' && m.data >= deISO && m.data <= ateISO;
  }).map(function(m){
    return { movId:m.id, data:m.data, competencia:mesKey(m.data), valor:m.valor,
      categoria:m.categoria, descricao:m.descricao, contaId:m.contaId };
  });
}
function somaPor(lista, chave){
  var mapa = {};
  lista.forEach(function(x){
    var k = x[chave] || '—';
    mapa[k] = (mapa[k] || 0) + x.valor;
  });
  return Object.keys(mapa).map(function(k){ return { chave:k, total:mapa[k] }; })
    .sort(function(a,b){ return b.total - a.total; });
}
function resumoPeriodo(deISO, ateISO){
  var desp = despesasNoPeriodo(deISO, ateISO);
  var rec = receitasNoPeriodo(deISO, ateISO);
  var td = desp.reduce(function(s,x){ return s + x.valor; }, 0);
  var tr = rec.reduce(function(s,x){ return s + x.valor; }, 0);
  return { despesas:desp, receitas:rec, totalDespesas:td, totalReceitas:tr, saldo:tr - td };
}
/* evolução mês a mês dentro do período */
function porMes(deISO, ateISO){
  var r = resumoPeriodo(deISO, ateISO);
  var mapa = {};
  function põe(k, campo, v){
    if (!mapa[k]) mapa[k] = { mes:k, despesas:0, receitas:0 };
    mapa[k][campo] += v;
  }
  r.despesas.forEach(function(x){ põe(x.competencia, 'despesas', x.valor); });
  r.receitas.forEach(function(x){ põe(x.competencia, 'receitas', x.valor); });
  return Object.keys(mapa).sort().map(function(k){
    var m = mapa[k]; m.saldo = m.receitas - m.despesas; return m;
  });
}
/* patrimônio ao fim de cada um dos últimos n meses */
function evolucaoPatrimonio(n){
  var out = [], mk = mesAtual();
  for (var i = n-1; i >= 0; i--) {
    var k = addMeses(mk, -i);
    out.push({ mes:k, valor:patrimonio(fimDoMes(k)) });
  }
  return out;
}

/* =============================================================
   VALIDAÇÃO — impede os estados proibidos do item 12
   ============================================================= */
function validarMov(m){
  var erros = [];
  if (!m.valor || m.valor <= 0) {
    if (m.tipo !== 'ajuste') erros.push('O valor precisa ser maior que zero.');
  }
  if (!m.data) erros.push('Informe a data.');

  if (m.tipo === 'transferencia') {
    if (!m.contaOrigemId && !m.metaOrigemId) erros.push('Escolha a conta de origem.');
    if (!m.contaDestinoId && !m.metaDestinoId) erros.push('Escolha a conta de destino.');
    if (m.contaOrigemId && m.contaOrigemId === m.contaDestinoId) erros.push('Origem e destino não podem ser a mesma conta.');
  }
  if (m.tipo === 'despesa') {
    if (!m.cartaoId && !m.contaId) erros.push('Escolha a conta que pagou.');
    if (m.cartaoId && !cartao(m.cartaoId)) erros.push('Cartão não encontrado.');
    if (m.cartaoId && (parseInt(m.parcelas,10) || 1) < 1) erros.push('Número de parcelas inválido.');
  }
  if (m.tipo === 'receita' && !m.contaId) erros.push('Escolha a conta que recebeu.');
  /* emprestimo_concedido e emprestimo_obtido aceitam ficar sem conta:
     serve para dívidas antigas, já embutidas no saldo que você cadastrou */

  if (m.tipo === 'pagamento_fatura') {
    if (!m.contaId) erros.push('Escolha a conta que vai pagar.');
    if (!m.cartaoId || !m.competencia) erros.push('Fatura não identificada.');
    else {
      var f = fatura(m.cartaoId, m.competencia);
      var jaPago = f.pago - (m.id ? pagamentosDaFatura(m.cartaoId, m.competencia)
        .filter(function(x){ return x.id === m.id; })
        .reduce(function(s,x){ return s + x.valor; }, 0) : 0);
      if (m.valor + jaPago > f.total) {
        erros.push('O pagamento passa do valor da fatura (' + fmt(f.total - jaPago) + ' em aberto).');
      }
    }
  }
  if ((m.tipo === 'recebimento_emprestimo' || m.tipo === 'pagamento_emprestimo' || m.tipo === 'perda_emprestimo')) {
    if (!m.emprestimoId) erros.push('Empréstimo não identificado.');
    else {
      var e = emprestimo(m.emprestimoId);
      var saldo = saldoEmprestimo(e);
      if (m.id) {
        var anterior = DB.mov.filter(function(x){ return x.id === m.id; })[0];
        if (anterior) saldo += anterior.valor;
      }
      if (m.valor > saldo) erros.push('O valor passa do saldo em aberto (' + fmt(saldo) + ').');
    }
  }
  return erros;
}

/* verifica se apagar um movimento deixa algo inconsistente */
function impedimentosParaApagar(m){
  var motivos = [];
  if (m.tipo === 'despesa' && m.cartaoId) {
    var cs = {};
    parcelasDaCompra(m).forEach(function(p){ cs[p.competencia] = 1; });
    Object.keys(cs).forEach(function(mk){
      var f = fatura(m.cartaoId, mk);
      if (f && f.pago > 0) {
        motivos.push('A fatura de ' + mesLabel(mk) + ' já tem pagamento registrado. Desfaça o pagamento antes.');
      }
    });
  }
  if (m.tipo === 'emprestimo_concedido' || m.tipo === 'emprestimo_obtido') {
    var outros = movsDoEmprestimo(m.emprestimoId).filter(function(x){ return x.id !== m.id; });
    if (outros.length) motivos.push('Esse empréstimo já tem devoluções registradas. Remova-as primeiro.');
  }
  return motivos;
}

            catch(e){ storageOK = false; } })();
function rawRead(k){
  if (storageOK) { try { return localStorage.getItem(k); } catch(e){ storageOK = false; } }

  if (storageOK) { try { localStorage.setItem(KEY, v); return; } catch(e){ storageOK = false; } }

function barraComposicao(ind){
  var partes = [

  ].filter(function(p){ return p.v > 0; });
  var soma = partes.reduce(function(s,p){ return s + p.v; }, 0) || 1;

function descreveMov(m){
  var c, nome;
  switch (m.tipo) {
    case 'receita':
      c = F.categoria('receita', m.categoria);
      return { titulo:m.descricao || c.nome, sub:['Receita', c.nome, nomeConta(m.contaId)].filter(Boolean).join(' · '),
               cor:'var(--pos)', corValor:'var(--pos)', sinal:'+ ', ic:ico('up','width:15px;height:15px') };
    case 'despesa':
      c = F.categoria('despesa', m.categoria);
      var ondePag = m.cartaoId ? nomeCartao(m.cartaoId) + (m.parcelas > 1 ? ' · ' + m.parcelas + 'x' : '') : nomeConta(m.contaId);
      return { titulo:m.descricao || c.nome, sub:[c.nome, ondePag, m.forma].filter(Boolean).join(' · '),
               cor:c.cor, corValor:'var(--ink)', sinal:'− ', ic:esc(iniciais(c.nome)) };
    case 'transferencia':
      return { titulo:m.descricao || 'Transferência', sub:'Entre contas · ' + nomeConta(m.contaOrigemId) + ' → ' + nomeConta(m.contaDestinoId),
               cor:'var(--rec)', corValor:'var(--rec)', sinal:'⇄ ', ic:ico('swap','width:15px;height:15px') };
    case 'emprestimo_concedido':
      nome = nomePessoa(m.emprestimoId);
      return { titulo:m.descricao || ('Emprestei para ' + nome), sub:'Empréstimo · ' + (m.contaId ? 'saiu de ' + nomeConta(m.contaId) : 'sem conta vinculada'),
               cor:'var(--rec)', corValor:'var(--ink)', sinal:'− ', ic:ico('hand','width:15px;height:15px') };
    case 'recebimento_emprestimo':
      nome = nomePessoa(m.emprestimoId);
      return { titulo:m.descricao || (nome + ' devolveu'), sub:'Devolução · ' + (m.contaId ? 'entrou em ' + nomeConta(m.contaId) : 'sem conta vinculada'),
               cor:'var(--rec)', corValor:'var(--rec)', sinal:'+ ', ic:ico('hand','width:15px;height:15px') };
    case 'emprestimo_obtido':
      nome = nomePessoa(m.emprestimoId);
      return { titulo:m.descricao || ('Peguei com ' + nome), sub:'Dívida · ' + (m.contaId ? 'entrou em ' + nomeConta(m.contaId) : 'sem conta vinculada'),
               cor:'var(--neg)', corValor:'var(--neg)', sinal:'+ ', ic:ico('hand','width:15px;height:15px') };
    case 'pagamento_emprestimo':
      nome = nomePessoa(m.emprestimoId);
      return { titulo:m.descricao || ('Devolvi para ' + nome), sub:'Pagamento de dívida · ' + (m.contaId ? 'saiu de ' + nomeConta(m.contaId) : 'sem conta vinculada'),
               cor:'var(--neg)', corValor:'var(--ink)', sinal:'− ', ic:ico('hand','width:15px;height:15px') };
    case 'perda_emprestimo':
      nome = nomePessoa(m.emprestimoId);
      return { titulo:m.descricao || ('Perda — ' + nome), sub:'Empréstimo dado como perdido · vira despesa',
               cor:'var(--neg)', corValor:'var(--ink)', sinal:'− ', ic:ico('alert','width:15px;height:15px') };
    case 'pagamento_fatura':
      return { titulo:m.descricao || ('Fatura ' + nomeCartao(m.cartaoId)), sub:'Pagamento de fatura · ' + F.mesLabel(m.competencia || '') + ' · ' + nomeConta(m.contaId),

/* compromissos que vencem: previstos, faturas e reposições juntos, por data */
function proximosCompromissos(limite){
  var out = [];
  F.getDB().previstos.forEach(function(p){
    out.push({ data:p.vencimento, titulo:p.descricao || p.categoria,
      sub:(p.tipo === 'receita' ? 'Receita prevista' : 'Despesa prevista') +
          (p.totalParcelas > 1 ? ' · parcela ' + p.parcela + '/' + p.totalParcelas : ''),
      valor:p.valor, tipo:p.tipo, act:'prev-det', id:p.id });
  });
  F.getDB().cartoes.forEach(function(c){
    F.faturasAbertas(c.id).forEach(function(f){
      out.push({ data:f.vencimento, titulo:'Fatura ' + c.nome,
        sub:'Fatura de ' + F.mesLabel(f.competencia), valor:f.aberto, tipo:'fatura',
        act:'fatura-abrir', id:c.id, comp:f.competencia });
    });
  });
  F.contasARepor().forEach(function(c){
    var nv = F.nivelConta(c);
    out.push({ data:F.hojeISO(), titulo:'Repor em ' + c.nome,
      sub:'reserva abaixo do patamar de ' + fmt(nv.nivel), valor:nv.falta,
      tipo:'reposicao', act:'conta-nivel', id:c.id });
  });
  out.sort(function(a,b){ return String(a.data).localeCompare(String(b.data)); });
  return limite ? out.slice(0, limite) : out;
}
function rowCompromisso(x){
  var atrasado = x.tipo !== 'reposicao' && x.data < F.hojeISO();
  var cores = { despesa:'var(--com)', receita:'var(--pos)', fatura:'var(--com)', reposicao:'var(--res)' };
  var dias = F.diasEntre(F.hojeISO(), x.data);
  var quando = x.tipo === 'reposicao' ? 'sem prazo'
             : atrasado ? 'venceu há ' + Math.abs(dias) + (Math.abs(dias)===1?' dia':' dias')
             : dias === 0 ? 'vence hoje' : dias === 1 ? 'vence amanhã'
             : dias <= 30 ? 'vence em ' + dias + ' dias' : 'vence ' + F.dataCurta(x.data);

    '<span class="row-ic" style="background:' + (cores[x.tipo]||'var(--ink-3)') + '">' +
      ico(x.tipo === 'fatura' ? 'cartao' : x.tipo === 'reposicao' ? 'swap' : 'pend','width:15px;height:15px') + '</span>' +
    '<span class="row-mid"><span class="row-t">' + esc(x.titulo) + '</span>' +
    '<span class="row-s" style="' + (atrasado ? 'color:var(--neg)' : '') + '">' + esc(x.sub) + ' · ' + quando + '</span></span>' +
    '<span class="row-v num">' + fmt(x.valor) + '</span></button>';

function blocoPrecisaDeVoce(){
  var hoje = F.hojeISO();
  var d7 = F.fromISO(hoje); d7.setDate(d7.getDate() + 7);
  var limite = F.toISO(d7);
  var urgentes = itensAgenda().filter(function(x){
    if (x.fluxo === 'entra') return !x.semData && x.data < hoje;   /* só cobrança atrasada */
    return x.semData || x.data <= limite;
  });
  if (!urgentes.length) {
    return '<section class="card"><div class="card-head"><h2>Precisa de você</h2>' +
        '<button class="link" data-act="ir" data-id="pend">Ver agenda</button></div>' +
      '<p class="hint" style="margin:0">Nada vencendo nos próximos sete dias. ' +
      'O que estiver marcado mais para frente está na agenda.</p></section>';
  }
  var mostra = urgentes.slice(0, 4);
  var resto = urgentes.length - mostra.length;
  var soma = urgentes.reduce(function(s,x){ return s + (x.fluxo === 'sai' ? x.valor : 0); }, 0);
  return '<section class="card destaque"><div class="card-head">' +
      '<h2>Precisa de você</h2>' +
      '<span class="tag t-neg">' + urgentes.length + '</span>' +
      '<button class="link" data-act="ir" data-id="pend">Ver agenda</button></div>' +
    '<div class="rows">' + mostra.map(rowAgenda).join('') + '</div>' +
    (resto > 0
      ? '<button class="btn btn-ghost btn-block" style="margin-top:10px" data-act="ir" data-id="pend">' +
        'mais ' + resto + (resto === 1 ? ' item na agenda' : ' itens na agenda') + '</button>'
      : '') +
    (soma ? '<div class="hint" style="margin-top:10px">Somando, são <b class="num">' + fmt(soma) +
            '</b> para sair nos próximos dias.</div>' : '') +
  '</section>';
}

var PERIODOS = [
  { id:'mes', nome:'Este mês' }, { id:'ant', nome:'Mês anterior' },
  { id:'3m', nome:'3 meses' }, { id:'6m', nome:'6 meses' },
  { id:'ano', nome:'Este ano' }, { id:'anoant', nome:'Ano anterior' },
  { id:'tudo', nome:'Tudo' }, { id:'custom', nome:'Escolher datas' }
];
function faixaPeriodo(p, de, ate){
  var h = new Date(), mk = F.mesAtual();
  if (p === 'mes') return { de:iniMes(mk), ate:fimMes(mk) };
  if (p === 'ant') { var a = F.addMeses(mk,-1); return { de:iniMes(a), ate:fimMes(a) }; }
  if (p === '3m') return { de:iniMes(F.addMeses(mk,-2)), ate:fimMes(mk) };
  if (p === '6m') return { de:iniMes(F.addMeses(mk,-5)), ate:fimMes(mk) };
  if (p === 'ano') return { de:h.getFullYear()+'-01-01', ate:h.getFullYear()+'-12-31' };
  if (p === 'anoant') return { de:(h.getFullYear()-1)+'-01-01', ate:(h.getFullYear()-1)+'-12-31' };
  if (p === 'custom') return { de:de || '1900-01-01', ate:ate || '2999-12-31' };
  return { de:'1900-01-01', ate:'2999-12-31' };
}

function movFiltrados(){
  var f = faixaPeriodo(UI.movPeriodo, UI.relDe, UI.relAte);
  var q = UI.movBusca.trim().toLowerCase();
  return F.getDB().mov.filter(function(m){
    if (m.data < f.de || m.data > f.ate) return false;
    if (UI.movTipo === 'despesa' && m.tipo !== 'despesa') return false;
    if (UI.movTipo === 'receita' && m.tipo !== 'receita') return false;
    if (UI.movTipo === 'transferencia' && m.tipo !== 'transferencia') return false;
    if (UI.movTipo === 'outros' && ['despesa','receita','transferencia'].indexOf(m.tipo) >= 0) return false;
    if (UI.movConta) {
      if ([m.contaId, m.contaOrigemId, m.contaDestinoId].indexOf(UI.movConta) < 0) return false;
    }
    if (UI.movCat && m.categoria !== UI.movCat) return false;
    if (!q) return true;
    var d = descreveMov(m);
    return (d.titulo + ' ' + d.sub + ' ' + (m.obs||'')).toLowerCase().indexOf(q) >= 0;
  }).sort(ordemMov);
}

      '</div>' +
      '<div class="chips" style="margin-top:10px">' +
        [['todos','Tudo'],['despesa','Despesas'],['receita','Receitas'],['transferencia','Transferências'],['outros','Empréstimos e faturas']]
          .map(function(t){
            return '<button class="chip" data-act="mov-tipo" data-id="' + t[0] + '" aria-pressed="' +
              (UI.movTipo===t[0]) + '">' + t[1] + '</button>';
          }).join('') +
      '</div>' +
      (function(){
        var ativos = (UI.movPeriodo !== 'mes' ? 1 : 0) + (UI.movConta ? 1 : 0) + (UI.movCat ? 1 : 0);
        return '<button class="btn btn-ghost btn-sm filtros-botao" data-act="mov-filtros" ' +
          'aria-expanded="' + (UI.movFiltros || ativos > 0) + '" style="margin-top:10px;width:100%">' +
          (UI.movFiltros || ativos ? 'Esconder filtros' : 'Mais filtros') +
          (ativos ? ' <span class="tag t-com">' + ativos + '</span>' : '') + '</button>';
      })() +
      '<div class="filtros-extra row-3" style="margin-top:10px"' +
        ((UI.movFiltros || UI.movPeriodo !== 'mes' || UI.movConta || UI.movCat) ? '' : ' hidden') + '>' +
        '<select class="input" id="flPeriodo">' + PERIODOS.map(function(p){
          return '<option value="' + p.id + '"' + (UI.movPeriodo===p.id?' selected':'') + '>' + p.nome + '</option>';
        }).join('') + '</select>' +
        '<select class="input" id="flConta"><option value="">Todas as contas</option>' +
          D.contas.map(function(c){
            return '<option value="' + esc(c.id) + '"' + (UI.movConta===c.id?' selected':'') + '>' + esc(c.nome) + '</option>';
          }).join('') + '</select>' +
        '<select class="input" id="flCat"><option value="">Todas as categorias</option>' +
          Object.keys(cats).sort().map(function(c){
            return '<option value="' + esc(c) + '"' + (UI.movCat===c?' selected':'') + '>' + esc(c) + '</option>';
          }).join('') + '</select>' +
      '</div>' +
      (UI.movPeriodo === 'custom'
        ? '<div class="row-2" style="margin-top:10px">' +
            '<div><label class="eyebrow" for="pDe">De</label><input class="input" type="date" id="pDe" value="' + esc(UI.relDe) + '"></div>' +
            '<div><label class="eyebrow" for="pAte">Até</label><input class="input" type="date" id="pAte" value="' + esc(UI.relAte) + '"></div>' +
          '</div>'
        : '') +
    '</section>';

  if (!D.mov.length) {
    return filtros + '<section class="card"><div class="empty">' +
      '<div class="empty-ic">' + ico('mov') + '</div>' +
      '<h3>Nenhuma movimentação ainda</h3>' +
      '<p>Registre o primeiro gasto, recebimento ou transferência.</p>' +
      '<button class="btn btn-primary" data-act="novo">' + ico('plus') + ' Novo lançamento</button>' +
      '</div></section>';
  }
  if (!lista.length) {
    return filtros + '<section class="card"><div class="empty">' +
      '<div class="empty-ic">' + ico('search') + '</div>' +
      '<h3>Nada encontrado</h3><p>Ajuste a busca ou os filtros.</p>' +
      '<button class="btn btn-ghost" data-act="mov-limpar">Limpar filtros</button></div></section>';
  }

  /* totais do que está filtrado */
  var tr = 0, td = 0;
  lista.forEach(function(m){
    if (m.tipo === 'receita') tr += m.valor;
    else if (m.tipo === 'despesa') td += m.valor;
  });

  var grupos = [], atual = null;
  lista.forEach(function(m){
    if (!atual || atual.data !== m.data) { atual = { data:m.data, itens:[] }; grupos.push(atual); }
    atual.itens.push(m);
  });

  var corpo = grupos.map(function(g){
    var soma = g.itens.reduce(function(s,m){
      return s + (m.tipo === 'receita' ? m.valor : m.tipo === 'despesa' ? -m.valor : 0);
    }, 0);
    return '<div class="daygroup"><div class="dayhead">' +
      '<span class="d">' + rotuloData(g.data) + '</span>' +
      '<span class="t num">' + (soma ? fmt(soma, {plus:true}) : '') + '</span></div>' +
      '<div class="rows">' + g.itens.map(function(m){ return rowMov(m, false); }).join('') + '</div></div>';
  }).join('');

  return filtros +
    '<div class="tiles tiles-3">' +
      '<div class="tile"><div class="l">Entrou</div><div class="v num pos">' + fmt(tr) + '</div></div>' +
      '<div class="tile"><div class="l">Saiu</div><div class="v num neg">' + fmt(td) + '</div></div>' +
      '<div class="tile"><div class="l">Diferença</div><div class="v num">' + fmt(tr-td) + '</div></div>' +
    '</div>' + corpo;
}
function rotuloData(iso){
  var dias = F.diasEntre(F.hojeISO(), iso);
  if (dias === 0) return 'Hoje';
  if (dias === -1) return 'Ontem';
  if (dias === 1) return 'Amanhã';
  var d = F.fromISO(iso);
  return d.getDate() + ' de ' + F.MES[d.getMonth()] + ' de ' + d.getFullYear();
}

    '<div class="hero-v num" style="font-size:30px;margin:8px 0 2px">' + fmt(saldo) + '</div>' +
    '<div class="hint">saldo de hoje · ' + ({corrente:'conta do dia a dia',reserva:'conta de reserva',investimento:'investimento'})[c.tipo] + '</div>' +
    '<div style="margin-top:14px">' +
      '<div class="kv"><span class="k">Saldo inicial cadastrado</span><span class="v num">' + fmt(c.saldoInicial) + '</span></div>' +
      '<div class="kv"><span class="k">Movimentações nesta conta</span><span class="v num">' + movs.length + '</span></div>' +

        ? '<div class="kv"><span class="k">Nível que quer manter</span><span class="v num">' + fmt(c.referencia) + '</span></div>' : '') +
      (F.metaDaConta(c.id)
        ? '<div class="kv"><span class="k">Alimenta a meta</span><span class="v">' + esc(F.metaDaConta(c.id).nome) + '</span></div>' : '') +

function abrirCartao(id, comp){
  var c = F.cartao(id);
  if (!c) return;
  var comps = F.competenciasDoCartao(id);
  if (!comps.length) comps = [F.competenciaDaCompra(c, F.hojeISO())];
  var atual = comp || UI.cartaoComp || F.competenciaDaCompra(c, F.hojeISO());
  if (comps.indexOf(atual) < 0) comps.push(atual), comps.sort();
  UI.cartaoComp = atual;
  var f = F.fatura(id, atual);
  var i = comps.indexOf(atual);

  var linhas = f.parcelas.length
    ? f.parcelas.map(function(p){
        var info = F.categoria('despesa', p.categoria);
        return '<button class="row" data-act="mov-det" data-id="' + p.movId + '">' +
          '<span class="row-ic" style="background:' + info.cor + '">' + esc(iniciais(p.categoria||'?')) + '</span>' +
          '<span class="row-mid"><span class="row-t">' + esc(p.descricao || p.categoria) +
            (p.total > 1 ? ' <span class="tag t-mut">' + p.numero + '/' + p.total + '</span>' : '') + '</span>' +
          '<span class="row-s">' + esc(p.categoria) + ' · compra em ' + F.dataCurta(p.dataCompra) + '</span></span>' +
          '<span class="row-v num">' + fmt(p.valor) + '</span></button>';
      }).join('')
    : '<div class="empty" style="padding:20px"><p>Nenhuma compra nesta fatura.</p></div>';

  var pagamentos = F.getDB().mov.filter(function(m){
    return m.tipo === 'pagamento_fatura' && m.cartaoId === id && m.competencia === atual;
  });

  abrirSheet(
    '<div class="sheet-head"><h2>' + esc(c.nome) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div style="display:flex;align-items:center;gap:6px;margin-top:8px">' +
      '<button class="iconbtn" data-act="fatura-nav" data-id="' + id + '" data-id2="' + (comps[i-1]||'') + '"' +
        (i <= 0 ? ' disabled' : '') + ' aria-label="Fatura anterior">' + ico('left') + '</button>' +
      '<span style="flex:1;text-align:center;font-weight:650;text-transform:capitalize">' + F.mesLabel(atual) + '</span>' +
      '<button class="iconbtn" data-act="fatura-nav" data-id="' + id + '" data-id2="' + (comps[i+1]||'') + '"' +
        (i >= comps.length-1 ? ' disabled' : '') + ' aria-label="Próxima fatura">' + ico('right') + '</button>' +
    '</div>' +
    '<div class="hero-v num" style="font-size:28px;margin:12px 0 2px">' + fmt(f.total) + '</div>' +
    '<div class="hint">vence ' + F.dataCurta(f.vencimento) +
      (f.quitada ? ' · <b class="pos">fatura paga</b>' : f.vencida ? ' · <b class="neg">vencida</b>' : '') + '</div>' +
    (f.pago > 0 && !f.quitada
      ? '<div class="note note-com">Já pago: <b>' + fmt(f.pago) + '</b>. Em aberto: <b>' + fmt(f.aberto) + '</b>.</div>' : '') +
    (f.aberto > 0
      ? '<button class="btn btn-primary btn-block" style="margin-top:12px" data-act="fatura-pagar" data-id="' + id +
        '" data-id2="' + atual + '">' + ico('check') + ' Registrar pagamento</button>' : '') +
    '<div class="field"><label>Compras desta fatura</label><div class="rows">' + linhas + '</div></div>' +
    (pagamentos.length
      ? '<div class="field"><label>Pagamentos</label><div class="rows">' + pagamentos.map(function(m){
          return '<button class="row" data-act="mov-det" data-id="' + m.id + '">' +
            '<span class="row-mid"><span class="row-t">' + F.dataCurta(m.data) + '</span>' +
            '<span class="row-s">' + esc(nomeConta(m.contaId)) + '</span></span>' +
            '<span class="row-v num pos">' + fmt(m.valor) + '</span></button>';
        }).join('') + '</div></div>'
      : '') +
    '<div class="note note-mut">A compra entra como despesa no mês da parcela. Pagar a fatura não cria gasto novo — só liquida a obrigação.</div>',
    null, true
  );
}
