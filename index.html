/* drill-down de categoria */
function drillCategoria(cat, tipo){
  var f = faixaPeriodo(UI.relPeriodo, UI.relDe, UI.relAte);
  var r = F.resumoPeriodo(f.de, f.ate);
  var lista = (tipo === 'receita' ? r.receitas : r.despesas).filter(function(x){ return x.categoria === cat; })
    .sort(function(a,b){ return b.data.localeCompare(a.data); });
  var total = lista.reduce(function(s,x){ return s + x.valor; }, 0);
  abrirSheet(
    '<div class="sheet-head"><h2>' + esc(cat) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="hero-v num" style="font-size:28px;margin:8px 0 2px">' + fmt(total) + '</div>' +
    '<div class="hint">' + lista.length + ' lançamento(s) · ' + F.dataCurta(f.de) + ' a ' + F.dataCurta(f.ate) + '</div>' +
    '<div class="field"><div class="rows">' + lista.map(function(x){
      return '<button class="row" data-act="mov-det" data-id="' + x.movId + '">' +
        '<span class="row-mid"><span class="row-t">' + esc(x.descricao || cat) + '</span>' +
        '<span class="row-s">' + F.dataCurta(x.data) +
          (x.cartaoId ? ' · ' + esc(nomeCartao(x.cartaoId)) : x.contaId ? ' · ' + esc(nomeConta(x.contaId)) : '') + '</span></span>' +
        '<span class="row-v num">' + fmt(x.valor) + '</span></button>';
    }).join('') + '</div></div>',
    null, true
  );
}

/* ligar contas a uma meta sem passar pelo formulário inteiro */
function formVincularContas(id){
  var m = F.meta(id);
  if (!m) return;
  var D = F.getDB();
  if (!D.contas.length) { toast('Cadastre uma conta primeiro'); formConta(null); return; }
  var sel = (m.contasVinculadas||[]).slice();
  function grid(){
    return D.contas.map(function(c){
      var dona = F.metaDaConta(c.id);
      var minha = dona && dona.id === m.id;
      var ocupada = dona && !minha;
      return '<button type="button" class="catbtn" data-conta="' + esc(c.id) + '"' +
        (ocupada ? ' disabled style="opacity:.45"' : '') +
        ' aria-pressed="' + (sel.indexOf(c.id) >= 0) + '">' +
        '<span class="sw" style="background:' + (c.cor||'#888') + '"></span>' +
        '<span>' + esc(c.nome) + '<br><span class="mut" style="font-size:11px;font-weight:500">' +
        (ocupada ? 'da meta ' + esc(dona.nome) : fmt(F.saldoConta(c))) + '</span></span></button>';
    }).join('');
  }
  abrirSheet(
    '<div class="sheet-head"><h2>Contas de ' + esc(m.nome) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<p class="hint" style="margin-top:4px">Escolha onde o dinheiro desta meta fica. O progresso passa a ser o saldo ' +
      'dessas contas — sobe e desce sozinho, sem você reservar valor nenhum.</p>' +
    '<div class="catgrid" id="vcContas" style="margin-top:12px">' + grid() + '</div>' +
    '<div class="note note-mut" id="vcResumo"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>' +
      '<button class="btn btn-primary" id="btnVC">Salvar</button>' +
    '</div>'
  , function(){
    function resumo(){
      var acc = sel.reduce(function(s,id){ var c = F.conta(id); return c ? s + F.saldoConta(c) : s; }, 0);
      var manual = (m.aportes||[]).length;
      el('vcResumo').innerHTML = sel.length
        ? 'A meta passa a valer <b>' + fmt(acc) + '</b>, que é o saldo somado dessas contas.' +
          (m.alvo ? ' Faltariam <b>' + fmt(Math.max(0, m.alvo - acc)) + '</b> para os ' + fmt(m.alvo) + '.' : '') +
          (manual ? ' As ' + manual + ' reserva(s) manual(is) desta meta deixam de ser somadas.' : '')
        : 'Sem conta escolhida, a meta volta a ser manual: você reserva valores avulsos.';
    }
    el('vcContas').addEventListener('click', function(ev){
      var b = ev.target.closest('button[data-conta]');
      if (!b || b.disabled) return;
      var cid = b.getAttribute('data-conta');
      var i = sel.indexOf(cid);
      if (i >= 0) sel.splice(i,1); else sel.push(cid);
      b.setAttribute('aria-pressed', String(i < 0));
      resumo();
    });
    resumo();
    el('btnVC').addEventListener('click', function(){
      marcar();
      m.contasVinculadas = sel.slice();
      salvar(); fecharSheet(); toast('Contas da meta atualizadas', true); render();
    });
  }, true);
}

/* resumo da série de um parcelado */
function serieDoPrevisto(p){
  var irmas = F.getDB().previstos.filter(function(x){ return x.serieId === p.serieId; })
    .sort(function(a,b){ return (a.parcela||0) - (b.parcela||0); });
  var faltam = irmas.reduce(function(s,x){ return s + x.valor; }, 0);
  var nomes = { mensal:'todo mês', quinzenal:'a cada 15 dias', semanal:'toda semana' };
  return '<div class="kv"><span class="k">Parcela</span><span class="v">' +
      p.parcela + ' de ' + p.totalParcelas + ' · ' + (nomes[p.periodicidade] || 'mensal') + '</span></div>' +
    '<div class="kv"><span class="k">Ainda em aberto</span><span class="v num">' +
      fmt(faltam) + ' em ' + irmas.length + ' parcela(s)</span></div>' +
    (irmas.length > 1
      ? '<div class="kv"><span class="k">Próximas</span><span class="v">' +
          irmas.slice(0,4).map(function(x){ return F.dataCurta(x.vencimento); }).join(' · ') +
          (irmas.length > 4 ? ' …' : '') + '</span></div>'
      : '');
}

/* apagar um previsto que faz parte de uma série */
function apagarPrevisto(id){
  var D = F.getDB();
  var p = D.previstos.filter(function(x){ return x.id === id; })[0];
  if (!p) return;
  if (!p.serieId) {
    confirmar('Apagar esta previsão?','Nada que já aconteceu é afetado.','Apagar', function(){
      marcar();
      D.previstos = D.previstos.filter(function(x){ return x.id !== id; });
      salvar(); toast('Apagado', true); render();
    }, true);
    return;
  }
  var irmas = D.previstos.filter(function(x){ return x.serieId === p.serieId; });
  abrirSheet(
    '<div class="sheet-head"><h2>Apagar parcela ' + p.parcela + '/' + p.totalParcelas + '?</h2></div>' +
    '<p style="font-size:14px;color:var(--ink-2);margin:4px 0 0;line-height:1.5">' +
      esc(p.descricao || p.categoria) + ' — ' + fmt(p.valor) + '. ' +
      'Este parcelamento ainda tem <b>' + irmas.length + '</b> parcela(s) em aberto.</p>' +
    '<div style="display:grid;gap:9px;margin-top:18px">' +
      '<button class="btn btn-danger" id="soEsta">Apagar só esta parcela</button>' +
      '<button class="btn btn-danger" id="todas">Apagar as ' + irmas.length + ' parcelas em aberto</button>' +
      '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>' +
    '</div>',
    function(){
      el('soEsta').addEventListener('click', function(){
        marcar();
        D.previstos = D.previstos.filter(function(x){ return x.id !== id; });
        salvar(); fecharSheet(); toast('Parcela apagada', true); render();
      });
      el('todas').addEventListener('click', function(){
        marcar();
        var serie = p.serieId;
        D.previstos = D.previstos.filter(function(x){ return x.serieId !== serie; });
        salvar(); fecharSheet(); toast('Parcelamento apagado', true); render();
      });
    }
  );
}

function formAjuste(contaId){
  var c = F.conta(contaId);
  if (!c) return;
  var atual = F.saldoConta(c);
  abrirSheet(
    '<div class="sheet-head"><h2>Ajustar saldo de ' + esc(c.nome) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<p class="hint" style="margin-top:6px">Use quando o saldo do app não bate com o do banco. ' +
      'O app registra só a diferença, como correção — não vira receita nem despesa.</p>' +
    '<div class="field"><label for="ajReal">Saldo real hoje</label>' +
      '<input class="input money" id="ajReal" inputmode="numeric" data-autofocus value="' + fmt(atual,{nosymbol:true}) + '"></div>' +
    '<div class="note note-mut" id="ajPrev">Sem diferença.</div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>' +
      '<button class="btn btn-primary" id="btnAj">Ajustar</button>' +
    '</div>',
    function(){
      ligarMoeda(el('ajReal'), function(v){
        var dif = v - atual;
        el('ajPrev').innerHTML = dif === 0 ? 'Sem diferença.'
          : 'Vai registrar uma correção de <b>' + fmt(dif, {plus:true}) + '</b> nesta conta.';
      });
      el('btnAj').addEventListener('click', function(){
        var dif = F.digitsToCents(el('ajReal').value) - atual;
        if (!dif) { toast('Nenhuma diferença para ajustar'); return; }
        marcar();
        F.getDB().mov.push({ id:F.uid(), tipo:'ajuste', valor:dif, data:F.hojeISO(), contaId:c.id,
          descricao:'Ajuste de saldo', criadoEm:new Date().toISOString() });
        salvar(); fecharSheet(); toast('Saldo ajustado', true); render();
      });
    }
  );
}

function baixar(nome, conteudo, mime){
  try {
    var blob = new Blob([conteudo], { type:mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 400);
    return true;
  } catch(e){ toast('Não foi possível baixar aqui. Abra o arquivo direto no navegador.'); return false; }
}
function csvEscapa(v){
  var s = String(v == null ? '' : v);
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csvValor(c){ return (c/100).toFixed(2).replace('.',','); }
function exportarMovimentacoes(){
  var f = faixaPeriodo(UI.relPeriodo, UI.relDe, UI.relAte);
  var r = F.resumoPeriodo(f.de, f.ate);
  var linhas = [['Data','Tipo','Categoria','Descrição','Conta','Cartão','Valor']];
  r.receitas.forEach(function(x){
    linhas.push([F.dataCurta(x.data),'Receita',x.categoria,x.descricao,nomeConta(x.contaId),'',csvValor(x.valor)]);
  });
  r.despesas.forEach(function(x){
    linhas.push([F.dataCurta(x.data),'Despesa',x.categoria,x.descricao,
      x.contaId?nomeConta(x.contaId):'', x.cartaoId?nomeCartao(x.cartaoId):'', csvValor(-x.valor)]);
  });
  if (linhas.length === 1) { toast('Nada para exportar neste período'); return; }
  var csv = linhas.map(function(l){ return l.map(csvEscapa).join(';'); }).join('\r\n');
  if (baixar('movimentacoes-' + f.de + '-a-' + f.ate + '.csv', '﻿' + csv, 'text/csv;charset=utf-8')) toast('CSV gerado');
}
function exportarCategorias(){
  var f = faixaPeriodo(UI.relPeriodo, UI.relDe, UI.relAte);
  var r = F.resumoPeriodo(f.de, f.ate);
  var linhas = [['Tipo','Categoria','Total']];
  F.somaPor(r.despesas,'categoria').forEach(function(c){ linhas.push(['Despesa',c.chave,csvValor(c.total)]); });
  F.somaPor(r.receitas,'categoria').forEach(function(c){ linhas.push(['Receita',c.chave,csvValor(c.total)]); });
  if (linhas.length === 1) { toast('Nada para exportar'); return; }
  var csv = linhas.map(function(l){ return l.map(csvEscapa).join(';'); }).join('\r\n');
  if (baixar('resumo-categorias-' + f.de + '-a-' + f.ate + '.csv', '﻿' + csv, 'text/csv;charset=utf-8')) toast('CSV gerado');
}
function exportarBackup(){
  if (baixar('meu-dinheiro-backup-' + F.hojeISO() + '.json', JSON.stringify(F.getDB(), null, 2), 'application/json'))
    toast('Backup baixado');
}
function restaurarBackup(file){
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var d = JSON.parse(fr.result);
      var novo = F.normalizar(d);
      confirmar('Restaurar este backup?',
        'O conteúdo atual será substituído por <b>' + novo.mov.length + '</b> movimentações, <b>' +
        novo.contas.length + '</b> contas e <b>' + novo.metas.length + '</b> metas.',
        'Restaurar', function(){
          marcar(); F.setDB(novo); salvar(); irPara('visao'); toast('Backup restaurado', true);
        });
    } catch(e){ toast('Arquivo inválido. Use um backup gerado por este app.'); }
  };
  fr.readAsText(file);
}

    '<div class="sheet-head"><h2>' + (receita?'Recebi':'Paguei') + ': ' + esc(p.descricao || p.categoria) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="hint" style="margin-top:6px">Previsto: ' + fmt(p.valor) + ' para ' + F.dataCurta(p.vencimento) + '</div>' +
    '<div class="field"><label for="cfValor">Valor ' + (receita?'recebido':'pago') + '</label>' +
      '<input class="input money" id="cfValor" inputmode="numeric" data-autofocus value="' + fmt(p.valor,{nosymbol:true}) + '">' +
      '<div class="hint">Ajuste se veio diferente do previsto.</div></div>' +
    '<div class="field"><label for="cfConta">' + (receita?'Entrou em':'Saiu de') + '</label>' +
      '<select class="input" id="cfConta">' + opcoesConta((contaPadrao()||{}).id) + '</select></div>' +
    '<div class="field"><label for="cfData">Data</label>' +
      '<input class="input" type="date" id="cfData" value="' + F.hojeISO() + '"></div>' +
    (p.repete === 'mensal'
      ? '<label class="check"><input type="checkbox" id="cfProx" checked><span>Já criar a próxima, com vencimento em ' +
        F.dataCurta(F.diaNoMes(F.addMeses(F.mesKey(p.vencimento),1), F.fromISO(p.vencimento).getDate())) + '.</span></label>'
      : '') +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>' +
      '<button class="btn btn-primary" id="btnConf">Confirmar</button>' +
    '</div>',
    function(){
      ligarMoeda(el('cfValor'));
      el('btnConf').addEventListener('click', function(){
        var v = F.digitsToCents(el('cfValor').value);
        if (!v) { toast('Informe o valor'); return; }
        marcar();
        var D = F.getDB();
        D.mov.push({ id:F.uid(), tipo: receita ? 'receita' : 'despesa', valor:v,
          data:el('cfData').value || F.hojeISO(), contaId:el('cfConta').value,
          categoria:p.categoria, descricao:p.descricao || p.categoria, obs:p.obs || '',
          criadoEm:new Date().toISOString() });
        var prox = el('cfProx');
        if (p.repete === 'mensal' && prox && prox.checked) {
          var d0 = F.fromISO(p.vencimento);
          D.previstos.push(Object.assign({}, p, { id:F.uid(),
            vencimento:F.diaNoMes(F.addMeses(F.mesKey(p.vencimento),1), d0.getDate()) }));
        }
        D.previstos = D.previstos.filter(function(x){ return x.id !== p.id; });
        salvar(); fecharSheet(); toast('Confirmado', true); render();
      });
    }
  );
}

/* =============================================================
   NUVEM — sincroniza este aparelho com o Supabase
   Regras:
     · o app funciona 100% sem nuvem; a nuvem é uma camada por cima
     · o aparelho sempre lê o local primeiro (abre instantâneo)
     · envio com versão condicional: ninguém sobrescreve ninguém sem avisar
     · conflito nunca é resolvido no escuro — sempre pergunta
   ============================================================= */

var NK = {
  cfg:  'meudinheiro.nuvem',
  est:  'meudinheiro.nuvem.estado',
  salvo:'meudinheiro.conflito'
};

var N = {
  url:'', anon:'', tabela:'meu_dinheiro_estado',
  email:'', uid:'', token:'', refresh:'', expira:0,
  dispositivo:'',
  versao:0, existe:false, sujo:false, ultimo:'',
  estado:'off',       /* off | deslogado | ok | enviando | puxando | offline | erro | conflito */
  msg:'',
  marca:0
};

function nuvemLigada(){ return !!(N.url && N.anon); }
function nuvemLogada(){ return nuvemLigada() && !!N.refresh && !!N.uid; }

function nomeAparelhoPadrao(){
  var ua = '';
  try { ua = navigator.userAgent || ''; } catch(e){}
  if (/iPad|Tablet/i.test(ua)) return 'Tablet';
  if (/Android|iPhone|Mobile/i.test(ua)) return 'Celular';
  return 'Computador';
}

function lerJSON(k){
  try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch(e){ return {}; }
}
function gravarJSON(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function nuvemSalvarCfg(){
  gravarJSON(NK.cfg, { url:N.url, anon:N.anon, tabela:N.tabela, email:N.email, uid:N.uid,
                       token:N.token, refresh:N.refresh, expira:N.expira, dispositivo:N.dispositivo });
}
function nuvemSalvarEst(){
  gravarJSON(NK.est, { versao:N.versao, existe:N.existe, sujo:N.sujo, ultimo:N.ultimo });
}

function nuvemCarregarCfg(){
  var g = {};
  try { g = (window.NUVEM_CONFIG || {}); } catch(e){}
  var s = lerJSON(NK.cfg), e = lerJSON(NK.est);
  N.url    = String(s.url || g.url || '').replace(/\/+$/,'');
  N.anon   = s.anon || g.anon || '';
  N.tabela = s.tabela || g.tabela || 'meu_dinheiro_estado';
  N.email  = s.email || '';
  N.uid    = s.uid || '';
  N.token  = s.token || '';
  N.refresh= s.refresh || '';
  N.expira = s.expira || 0;
  N.dispositivo = s.dispositivo || nomeAparelhoPadrao();
  N.versao = e.versao || 0;
  N.existe = !!e.existe;
  N.sujo   = !!e.sujo;
  N.ultimo = e.ultimo || '';
  N.estado = !nuvemLigada() ? 'off' : (N.refresh ? 'ok' : 'deslogado');
}

/* ---------- http ---------- */
function nuvemReq(caminho, opts){
  opts = opts || {};
  var h = { 'apikey': N.anon, 'Content-Type': 'application/json' };
  if (opts.auth !== false && N.token) h['Authorization'] = 'Bearer ' + N.token;
  if (opts.headers) for (var k in opts.headers) if (opts.headers.hasOwnProperty(k)) h[k] = opts.headers[k];
  var init = { method: opts.method || 'GET', headers: h };
  if (opts.body !== undefined) init.body = JSON.stringify(opts.body);
  return fetch(N.url + caminho, init).then(function(r){
    return r.text().then(function(t){
      var j = null;
      if (t) { try { j = JSON.parse(t); } catch(e){ j = t; } }
      return { ok:r.ok, status:r.status, body:j };
    });
  });
}

function erroTexto(r){
  var b = r && r.body;
  if (b && typeof b === 'object') {
    if (b.error_description) return b.error_description;
    if (b.msg) return b.msg;
    if (b.message) return b.message;
    if (b.error) return String(b.error);
    if (b.hint) return b.hint;
  }
  if (typeof b === 'string' && b) return b.slice(0,180);
  if (r && r.status === 404) return 'Tabela não encontrada — rode o SQL de instalação no Supabase.';
  if (r && r.status === 401) return 'Chave ou login recusados.';
  return 'Erro ' + ((r && r.status) || '?') + ' na nuvem.';
}

function aplicarSessao(b){
  if (!b || !b.access_token) return false;
  N.token   = b.access_token;
  N.refresh = b.refresh_token || N.refresh;
  N.expira  = Date.now() + ((b.expires_in || 3600) * 1000);
  if (b.user && b.user.id) N.uid = b.user.id;
  if (b.user && b.user.email) N.email = b.user.email;
  nuvemSalvarCfg();
  return true;
}

function comToken(){
  if (!nuvemLogada()) return Promise.reject(new Error('Você não está conectado à nuvem.'));
  if (N.token && Date.now() < N.expira - 60000) return Promise.resolve();
  return nuvemReq('/auth/v1/token?grant_type=refresh_token',
      { method:'POST', auth:false, body:{ refresh_token:N.refresh } })
    .then(function(r){
      if (!r.ok || !aplicarSessao(r.body)) {
        N.token = ''; N.refresh = ''; N.estado = 'deslogado'; nuvemSalvarCfg();
        throw new Error('Sua sessão expirou. Entre de novo.');
      }
    });
}

/* chamada autenticada: se o servidor recusar o token, renova e tenta de novo */
function nuvemRest(caminho, opts, jaRenovou){
  return comToken().then(function(){
    return nuvemReq(caminho, opts);
  }).then(function(r){
    if (r.status === 401 && !jaRenovou && N.refresh) {
      N.expira = 0;                       /* obriga o comToken a renovar */
      return nuvemRest(caminho, opts, true);
    }
    return r;
  });
}

/* ---------- entrar / cadastrar / sair ---------- */
function nuvemEntrar(email, senha){
  return nuvemReq('/auth/v1/token?grant_type=password',
      { method:'POST', auth:false, body:{ email:email, password:senha } })
    .then(function(r){
      if (!r.ok || !aplicarSessao(r.body)) throw new Error(erroTexto(r));
      N.versao = 0; N.existe = false; nuvemSalvarEst();
      N.estado = 'ok';
      return nuvemPrimeiraVez();
    });
}

function nuvemCadastrar(email, senha){
  return nuvemReq('/auth/v1/signup', { method:'POST', auth:false, body:{ email:email, password:senha } })
    .then(function(r){
      if (!r.ok) throw new Error(erroTexto(r));
      if (!aplicarSessao(r.body)) {
        throw new Error('Conta criada. Confirme o e-mail que o Supabase enviou e depois entre, ' +
                        'ou desligue a confirmação de e-mail no painel do Supabase.');
      }
      N.versao = 0; N.existe = false; nuvemSalvarEst();
      N.estado = 'ok';
      return nuvemPrimeiraVez();
    });
}

function nuvemSair(){
  N.token = ''; N.refresh = ''; N.uid = ''; N.email = '';
  N.versao = 0; N.existe = false; N.sujo = false;
  N.estado = nuvemLigada() ? 'deslogado' : 'off';
  nuvemSalvarCfg(); nuvemSalvarEst();
  pintarNuvem(); render();
}

/* ---------- ler e escrever o estado ---------- */
function nuvemPuxar(){
  return nuvemRest('/rest/v1/' + N.tabela +
      '?select=dados,versao,atualizado_em,dispositivo&usuario_id=eq.' + encodeURIComponent(N.uid))
    .then(function(r){
    if (!r.ok) throw new Error(erroTexto(r));
    var linha = (r.body && r.body.length) ? r.body[0] : null;
    N.existe = !!linha;
    return linha;
  });
}

var envioEmVoo = false, timerEnvio = null, remotoPendente = null;
var ultimoEnviado = null;   /* { versao, json } — para reconhecer o próprio envio */

function nuvemEnviarAgora(){
  if (!nuvemLogada() || N.estado === 'conflito') return Promise.resolve();
  if (envioEmVoo) return Promise.resolve();
  var online = true;
  try { online = navigator.onLine !== false; } catch(e){}
  if (!online) { marcarNuvem('offline'); return Promise.resolve(); }

  envioEmVoo = true;
  clearTimeout(timerEnvio);
  var marcaEnviada = N.marca;
  var base = N.versao;
  var dados = F.getDB();
  marcarNuvem('enviando');

  var corpo = { dados: dados, versao: base + 1, dispositivo: N.dispositivo,
                atualizado_em: new Date().toISOString() };
  ultimoEnviado = { versao: base + 1, json: JSON.stringify(dados) };
  var chamada;
  if (!N.existe) {
    corpo.usuario_id = N.uid;
    chamada = nuvemRest('/rest/v1/' + N.tabela,
      { method:'POST', body:corpo, headers:{ 'Prefer':'return=representation' } });
  } else {
    chamada = nuvemRest('/rest/v1/' + N.tabela +
        '?usuario_id=eq.' + encodeURIComponent(N.uid) + '&versao=eq.' + base,
      { method:'PATCH', body:corpo, headers:{ 'Prefer':'return=representation' } });
  }
  return chamada.then(function(r){
    envioEmVoo = false;
    /* linha já existia: o POST bate na chave primária */
    if (r.status === 409 || r.status === 400) {
      if (!N.existe) { N.existe = true; nuvemSalvarEst(); return nuvemSincronizar(true); }
      throw new Error(erroTexto(r));
    }
    /* o PATCH condicional não achou nada: alguém gravou antes de mim */
    if (r.ok && Array.isArray(r.body) && r.body.length === 0 && N.existe) {
      return nuvemPuxar().then(function(linha){
        if (!linha) { N.existe = false; return nuvemEnviarAgora(); }
        if (ultimoEnviado && linha.versao === ultimoEnviado.versao &&
            JSON.stringify(linha.dados) === ultimoEnviado.json) {
          /* era o meu próprio envio: chegou, mas a resposta se perdeu no caminho */
          N.versao = linha.versao; N.sujo = false; N.ultimo = new Date().toISOString();
          nuvemSalvarEst(); marcarNuvem('ok'); return;
        }
        return nuvemConflito(linha);
      });
    }
    if (!r.ok) throw new Error(erroTexto(r));

    var linha = Array.isArray(r.body) ? r.body[0] : r.body;
    N.versao = (linha && linha.versao) || (base + 1);
    N.existe = true;
    N.ultimo = new Date().toISOString();
    if (N.marca === marcaEnviada) { N.sujo = false; marcarNuvem('ok'); }
    else { N.sujo = true; marcarNuvem('enviando'); timerEnvio = setTimeout(nuvemEnviarAgora, 600); }
    nuvemSalvarEst();
  }).catch(function(e){
    envioEmVoo = false;
    falhaNuvem(e);
  });
}

function nuvemSincronizar(silencioso){
  if (!nuvemLogada() || N.estado === 'conflito') return Promise.resolve();
  var online = true;
  try { online = navigator.onLine !== false; } catch(e){}
  if (!online) { marcarNuvem('offline'); return Promise.resolve(); }
  marcarNuvem('puxando');
  return nuvemPuxar().then(function(linha){
    if (!linha) return nuvemEnviarAgora();
    if (linha.versao > N.versao) {
      if (N.sujo) return nuvemConflito(linha);
      return aplicarRemoto(linha, silencioso);
    }
    if (N.sujo) return nuvemEnviarAgora();
    N.ultimo = new Date().toISOString();
    nuvemSalvarEst(); marcarNuvem('ok');
  }).catch(falhaNuvem);
}

/* primeira vez neste aparelho depois de entrar */
function nuvemPrimeiraVez(){
  return nuvemPuxar().then(function(linha){
    var local = F.getDB();
    var temLocal = (local.mov && local.mov.length) || (local.metas && local.metas.length) ||
                   (local.emprestimos && local.emprestimos.length) ||
                   (local.contas && local.contas.length > 1);
    if (!linha) {                       /* nuvem vazia: sobe o que tem aqui */
      N.versao = 0; N.existe = false;
      return nuvemEnviarAgora().then(function(){ render(); });
    }
    if (!temLocal) {                    /* aparelho novo: adota a nuvem */
      return aplicarRemoto(linha);
    }
    escolherNaPrimeiraVez(linha);
    return 'escolha';
  }).catch(falhaNuvem);
}

function aplicarRemoto(linha, silencioso){
  if (sheetAberto) { remotoPendente = linha; marcarNuvem('ok'); return; }
  try {
    F.setDB(F.normalizar(linha.dados));
  } catch(e){ falhaNuvem(new Error('Os dados que vieram da nuvem não puderam ser lidos.')); return; }
  N.versao = linha.versao; N.sujo = false; N.existe = true;
  N.ultimo = new Date().toISOString();
  nuvemSalvarEst();
  salvarLocal();
  marcarNuvem('ok');
  render();
  if (!silencioso) {
    var de = linha.dispositivo && linha.dispositivo !== N.dispositivo ? ' do ' + linha.dispositivo : '';
    toast('Atualizado com o que você lançou' + de);
  }
}

function nuvemAplicarPendente(){
  if (!remotoPendente) return;
  var l = remotoPendente; remotoPendente = null;
  setTimeout(function(){ aplicarRemoto(l); }, 240);
}

/* ---------- gancho do salvamento local ---------- */
function nuvemAposSalvar(){
  N.marca++;
  if (!nuvemLogada()) return;
  N.sujo = true; nuvemSalvarEst();
  if (N.estado === 'conflito') { pintarNuvem(); return; }
  marcarNuvem('enviando');
  clearTimeout(timerEnvio);
  timerEnvio = setTimeout(nuvemEnviarAgora, 2200);
}

function marcarNuvem(e, msg){
  N.estado = e; N.msg = msg || '';
  pintarNuvem();
}
function falhaNuvem(e){
  var m = (e && e.message) || 'Não deu para falar com a nuvem.';
  if (/sess[ãa]o expirou|não está conectado/i.test(m)) { N.estado = 'deslogado'; N.msg = m; }
  else { N.estado = 'erro'; N.msg = m; }
  pintarNuvem();
}

/* ---------- selo de situação ---------- */
function nuvemResumo(){
  if (N.estado === 'off')       return { cor:'mut', t:'Só neste aparelho', d:'Ative a nuvem para usar no celular também' };
  if (N.estado === 'deslogado') return { cor:'alerta', t:'Entrar na nuvem', d:N.msg || 'Conecte para sincronizar' };
  if (N.estado === 'conflito')  return { cor:'neg', t:'Dois aparelhos mudaram', d:'Escolha qual versão vale' };
  if (N.estado === 'erro')      return { cor:'neg', t:'Falha ao sincronizar', d:N.msg };
  if (N.estado === 'offline')   return { cor:'alerta', t:'Sem internet', d:'Vai subir quando voltar' };
  if (N.estado === 'puxando')   return { cor:'ok', busy:1, t:'Verificando…', d:'' };
  if (N.estado === 'enviando')  return { cor:'ok', busy:1, t:'Salvando na nuvem…', d:'' };
  return { cor:'ok', quieto: !N.sujo,
           t: N.sujo ? 'Pendente de envio' : 'Tudo sincronizado',
           d: N.ultimo ? 'última vez ' + horaCurta(N.ultimo) : '' };
}
function horaCurta(iso){
  try {
    var d = new Date(iso);
    var hoje = new Date();
    var hh = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    if (d.toDateString() === hoje.toDateString()) return hh;
    return ('0'+d.getDate()).slice(-2) + '/' + ('0'+(d.getMonth()+1)).slice(-2) + ' ' + hh;
  } catch(e){ return ''; }
}

function nuvemPill(){
  var r = nuvemResumo();
  return '<button class="nuvem-pill n-' + r.cor + (r.busy ? ' n-busy' : '') +
    (r.quieto ? ' n-quieto' : '') + '" data-nuvem-pill data-act="nuvem" ' +
    'title="' + esc(r.t + (r.d ? ' — ' + r.d : '')) + '" aria-label="' + esc('Nuvem: ' + r.t) + '">' +
    '<i class="dot"></i><span>' + esc(r.t) + '</span></button>';
}
function pintarNuvem(){
  var ns = document.querySelectorAll('[data-nuvem-pill]');
  for (var i=0;i<ns.length;i++){
    var r = nuvemResumo();
    ns[i].className = 'nuvem-pill n-' + r.cor + (r.busy ? ' n-busy' : '') +
                      (r.quieto ? ' n-quieto' : '');
    ns[i].innerHTML = '<i class="dot"></i><span>' + esc(r.t) + '</span>';
    ns[i].setAttribute('title', r.t + (r.d ? ' — ' + r.d : ''));
  }
  var cartao = el('nuvemCartao');
  if (cartao) cartao.innerHTML = corpoCartaoNuvem();
}

/* ---------- cartão dentro de Ajustes ---------- */
function corpoCartaoNuvem(){
  var r = nuvemResumo();
  var linhas = '<div class="kv"><span class="k">Situação</span>' +
    '<span class="v"><span class="nuvem-pill n-' + r.cor + '" style="pointer-events:none">' +
    '<i class="dot"></i><span>' + esc(r.t) + '</span></span></span></div>';
  if (r.d && N.estado !== 'off') linhas += '<p class="hint" style="margin:2px 0 10px">' + esc(r.d) + '</p>';
  if (nuvemLogada()) {
    linhas += '<div class="kv"><span class="k">Conta</span><span class="v">' + esc(N.email) + '</span></div>' +
      '<div class="kv"><span class="k">Este aparelho</span><span class="v">' + esc(N.dispositivo) + '</span></div>' +
      '<div class="kv"><span class="k">Versão dos dados</span><span class="v num">' + N.versao + '</span></div>' +
      '<div class="row-2" style="margin-top:12px">' +
        '<button class="btn btn-ghost" data-act="nuvem-sync">Sincronizar agora</button>' +
        '<button class="btn btn-ghost" data-act="nuvem">Configurar</button>' +
      '</div>';
  } else if (nuvemLigada()) {
    linhas += '<p class="hint" style="margin:0 0 12px">A nuvem está configurada. Entre com seu e-mail e senha ' +
      'para que este aparelho passe a compartilhar os mesmos dados.</p>' +
      '<button class="btn btn-primary btn-block" data-act="nuvem">Entrar na nuvem</button>';
  } else {
    linhas += '<p class="hint" style="margin:0 0 12px">Hoje os dados ficam só neste aparelho. ' +
      'Ligando a nuvem, o que você lança no celular aparece no computador e vice-versa.</p>' +
      '<button class="btn btn-primary btn-block" data-act="nuvem">Ligar a nuvem</button>';
  }
  return linhas;
}

/* ---------- telas da nuvem ---------- */
function telaNuvem(){
  if (!nuvemLigada()) return formNuvemConfig();
  if (!nuvemLogada()) return formNuvemLogin();
  return formNuvemConta();
}

function formNuvemConfig(){
  abrirSheet(
    '<div class="sheet-head"><h2>Ligar a nuvem</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<p class="hint" style="margin-top:6px">Cole os dois dados do seu projeto no Supabase. ' +
      'Eles estão em <b>Project Settings → API Keys</b>, ou no botão <b>Connect</b> do topo. ' +
      'A chave pública pode ficar visível: quem protege os dados é o login. ' +
      'A <i>service_role</i> nunca vai aqui.</p>' +
    '<div class="field"><label for="nvUrl">Endereço do projeto</label>' +
      '<input class="input" id="nvUrl" placeholder="https://xxxxxxxx.supabase.co" data-autofocus value="' + esc(N.url) + '"></div>' +
    '<div class="field"><label for="nvAnon">Chave pública</label>' +
      '<textarea class="input" id="nvAnon" rows="3" placeholder="sb_publishable_... ou eyJhbGciOi...">' + esc(N.anon) + '</textarea>' +
      '<p class="hint">Aparece como <b>Publishable key</b> nos projetos novos e como ' +
      '<b>anon public</b> nos antigos. Qualquer uma das duas serve.</p></div>' +
    '<div class="field"><label for="nvTab">Tabela</label>' +
      '<input class="input" id="nvTab" value="' + esc(N.tabela) + '"></div>' +
    '<div class="note note-mut">Antes de entrar, rode uma vez o SQL de instalação (arquivo ' +
      '<b>supabase.sql</b>) no editor SQL do Supabase. Ele cria a tabela e tranca o acesso por usuário.</div>' +
    '<div id="nvErro"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>' +
      '<button class="btn btn-primary" id="nvSalvar">Continuar</button>' +
    '</div>',
    function(){
      el('nvSalvar').addEventListener('click', function(){
        var u = (el('nvUrl').value || '').trim().replace(/\/+$/,'');
        var a = (el('nvAnon').value || '').trim();
        var t = (el('nvTab').value || '').trim() || 'meu_dinheiro_estado';
        if (!/^https:\/\/.+/.test(u)) { avisoNv('O endereço precisa começar com https://'); return; }
        if (a.length < 20) { avisoNv('A chave anon parece incompleta.'); return; }
        N.url = u; N.anon = a; N.tabela = t;
        N.estado = 'deslogado';
        nuvemSalvarCfg();
        formNuvemLogin();
      });
    }
  );
}
function avisoNv(m){
  var d = el('nvErro');
  if (d) d.innerHTML = '<div class="note note-neg">' + esc(m) + '</div>';
}

function formNuvemLogin(){
  abrirSheet(
    '<div class="sheet-head"><h2>Entrar na nuvem</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<p class="hint" style="margin-top:6px">Use o mesmo e-mail e senha em todos os aparelhos. ' +
      'Na primeira vez, crie a conta.</p>' +
    '<div class="field"><label for="nvEmail">E-mail</label>' +
      '<input class="input" id="nvEmail" type="email" inputmode="email" autocomplete="username" data-autofocus value="' + esc(N.email) + '"></div>' +
    '<div class="field"><label for="nvSenha">Senha</label>' +
      '<input class="input" id="nvSenha" type="password" autocomplete="current-password"></div>' +
    '<div class="field"><label for="nvApar">Nome deste aparelho</label>' +
      '<input class="input" id="nvApar" value="' + esc(N.dispositivo) + '">' +
      '<p class="hint">Aparece quando dois aparelhos discordam, para você saber qual é qual.</p></div>' +
    '<div id="nvErro"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="nuvem-config">Mudar o projeto</button>' +
      '<button class="btn btn-primary" id="nvEntrar">Entrar</button>' +
    '</div>' +
    '<button class="btn btn-ghost btn-block" style="margin-top:10px" id="nvCriar">Criar conta com este e-mail</button>',
    function(){
      function pegar(){
        N.dispositivo = (el('nvApar').value || '').trim() || nomeAparelhoPadrao();
        nuvemSalvarCfg();
        return { e:(el('nvEmail').value||'').trim(), s:el('nvSenha').value||'' };
      }
      function rodar(fn, botao){
        var v = pegar();
        if (!v.e || !v.s) { avisoNv('Preencha e-mail e senha.'); return; }
        if (v.s.length < 6) { avisoNv('A senha precisa de pelo menos 6 caracteres.'); return; }
        botao.disabled = true; botao.textContent = 'Conectando…';
        fn(v.e, v.s).then(function(r){
          botao.disabled = false;
          if (r === 'escolha') return;   /* a tela de escolha já ocupou o lugar */
          fecharSheet(); render();
          toast('Nuvem ligada neste aparelho');
        }).catch(function(err){
          botao.disabled = false;
          botao.textContent = botao.id === 'nvCriar' ? 'Criar conta com este e-mail' : 'Entrar';
          avisoNv((err && err.message) || 'Não deu para entrar.');
        });
      }
      el('nvEntrar').addEventListener('click', function(){ rodar(nuvemEntrar, this); });
      el('nvCriar').addEventListener('click', function(){ rodar(nuvemCadastrar, this); });
      el('nvSenha').addEventListener('keydown', function(ev){
        if (ev.key === 'Enter') el('nvEntrar').click();
      });
    }
  );
}

function formNuvemConta(){
  var r = nuvemResumo();
  abrirSheet(
    '<div class="sheet-head"><h2>Nuvem</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="kv"><span class="k">Situação</span><span class="v">' +
      '<span class="nuvem-pill n-' + r.cor + '" style="pointer-events:none"><i class="dot"></i><span>' +
      esc(r.t) + '</span></span></span></div>' +
    (r.d ? '<p class="hint" style="margin:2px 0 8px">' + esc(r.d) + '</p>' : '') +
    '<div class="kv"><span class="k">Conta</span><span class="v">' + esc(N.email) + '</span></div>' +
    '<div class="kv"><span class="k">Projeto</span><span class="v mut" style="font-size:12px">' + esc(N.url.replace(/^https:\/\//,'')) + '</span></div>' +
    '<div class="field" style="margin-top:14px"><label for="nvApar2">Nome deste aparelho</label>' +
      '<input class="input" id="nvApar2" value="' + esc(N.dispositivo) + '"></div>' +
    '<div class="row-2" style="margin-top:4px">' +
      '<button class="btn btn-ghost" data-act="nuvem-sync">Sincronizar agora</button>' +
      '<button class="btn btn-ghost" data-act="nuvem-baixar">Baixar o da nuvem</button>' +
    '</div>' +
    '<div class="note note-mut" style="margin-top:14px">Sair não apaga nada: os dados continuam neste aparelho ' +
      'e na nuvem. Só este aparelho para de sincronizar.</div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="nuvem-config">Mudar o projeto</button>' +
      '<button class="btn btn-danger" data-act="nuvem-sair">Sair da nuvem</button>' +
    '</div>',
    function(){
      var i = el('nvApar2');
      if (i) i.addEventListener('change', function(){
        N.dispositivo = (i.value||'').trim() || nomeAparelhoPadrao();
        nuvemSalvarCfg(); toast('Nome do aparelho salvo');
      });
    }
  );
}

/* ---------- conflitos ---------- */
function contaMov(d){ return (d && d.mov && d.mov.length) || 0; }

function resumoLado(titulo, dados, quando, aparelho){
  return '<div class="card" style="margin:0 0 10px;padding:14px">' +
    '<div class="eyebrow">' + esc(titulo) + '</div>' +
    '<div style="font-size:15px;font-weight:650;margin-top:2px">' + contaMov(dados) + ' lançamentos</div>' +
    '<div class="hint" style="margin-top:2px">' +
      (aparelho ? esc(aparelho) + ' · ' : '') + (quando ? horaCurta(quando) : 'agora') + '</div>' +
  '</div>';
}

function escolherNaPrimeiraVez(linha){
  var local = F.getDB();
  abrirSheet(
    '<div class="sheet-head"><h2>Os dois lados têm dados</h2></div>' +
    '<p class="hint" style="margin-top:6px">A nuvem já tinha um histórico e este aparelho também. ' +
      'Escolha qual vale a partir de agora — o outro fica guardado num arquivo antes de qualquer coisa.</p>' +
    resumoLado('Na nuvem', linha.dados, linha.atualizado_em, linha.dispositivo) +
    resumoLado('Neste aparelho (' + N.dispositivo + ')', local, '', '') +
    '<div class="sheet-actions" style="grid-template-columns:1fr">' +
      '<button class="btn btn-primary" id="cfNuvem">Usar o da nuvem</button>' +
      '<button class="btn btn-ghost" id="cfLocal">Usar o deste aparelho</button>' +
      '<button class="btn btn-ghost" data-act="nuvem-sair">Cancelar e ficar sem nuvem</button>' +
    '</div>',
    function(){
      el('cfNuvem').addEventListener('click', function(){
        guardarCopia(local, 'deste-aparelho');
        fecharSheet(); aplicarRemoto(linha);
        toast('Agora este aparelho usa os dados da nuvem');
      });
      el('cfLocal').addEventListener('click', function(){
        guardarCopia(linha.dados, 'da-nuvem');
        N.versao = linha.versao; N.existe = true; N.sujo = true; nuvemSalvarEst();
        fecharSheet();
        nuvemEnviarAgora().then(function(){ render(); toast('A nuvem recebeu os dados deste aparelho'); });
      });
    }
  );
}

function nuvemConflito(linha){
  N.estado = 'conflito';
  clearTimeout(timerEnvio);
  pintarNuvem();
  var local = F.getDB();
  var abrir = function(){
    abrirSheet(
      '<div class="sheet-head"><h2>Dois aparelhos mudaram</h2></div>' +
      '<p class="hint" style="margin-top:6px">Você lançou coisas aqui e outro aparelho também gravou na nuvem. ' +
        'Não vou escolher no seu lugar. O lado que você não usar fica guardado num arquivo.</p>' +
      resumoLado('Na nuvem', linha.dados, linha.atualizado_em, linha.dispositivo) +
      resumoLado('Neste aparelho (' + N.dispositivo + ')', local, '', '') +
      '<div class="sheet-actions" style="grid-template-columns:1fr">' +
        '<button class="btn btn-primary" id="cxLocal">Manter o deste aparelho</button>' +
        '<button class="btn btn-ghost" id="cxNuvem">Usar o da nuvem</button>' +
        '<button class="btn btn-ghost" id="cxDepois">Decidir depois</button>' +
      '</div>',
      function(){
        el('cxLocal').addEventListener('click', function(){
          guardarCopia(linha.dados, 'da-nuvem');
          N.versao = linha.versao; N.existe = true; N.sujo = true;
          N.estado = 'enviando'; nuvemSalvarEst();
          fecharSheet();
          nuvemEnviarAgora().then(function(){ render(); toast('A nuvem ficou com os dados deste aparelho'); });
        });
        el('cxNuvem').addEventListener('click', function(){
          guardarCopia(local, 'deste-aparelho');
          N.estado = 'ok'; N.sujo = false;
          fecharSheet(); aplicarRemoto(linha);
        });
        el('cxDepois').addEventListener('click', function(){
          fecharSheet(); pintarNuvem();
          toast('Nada foi perdido. Resolva em Ajustes quando quiser');
        });
      }
    );
  };
  if (sheetAberto) { fecharSheet(); setTimeout(abrir, 260); } else abrir();
}

function guardarCopia(dados, sufixo){
  try { gravarJSON(NK.salvo, { quando:new Date().toISOString(), origem:sufixo, dados:dados }); } catch(e){}
  try { baixar('meu-dinheiro-' + sufixo + '-' + F.hojeISO() + '.json', JSON.stringify(dados,null,2), 'application/json'); } catch(e){}
}

function nuvemBaixarRemoto(){
  nuvemPuxar().then(function(linha){
    if (!linha) { toast('A nuvem ainda não tem dados'); return; }
    baixar('meu-dinheiro-da-nuvem-' + F.hojeISO() + '.json', JSON.stringify(linha.dados,null,2), 'application/json');
    toast('Arquivo da nuvem baixado');
  }).catch(falhaNuvem);
}

/* ---------- instalar como app ---------- */
var promptInstalar = null;
function podeInstalar(){ return !!promptInstalar; }
function jaInstalado(){
  try {
    if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if (window.navigator.standalone === true) return true;
  } catch(e){}
  return false;
}
function instalarApp(){
  if (jaInstalado()) {
    abrirSheet(
      '<div class="sheet-head"><h2>Já está instalado</h2>' +
        '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
      '<p class="hint" style="margin-top:6px">Você está usando o app instalado agora mesmo — é por isso ' +
        'que não aparece a barra de endereço. Para abrir depois, procure o ícone na tela inicial.</p>'
    );
    return;
  }
  if (!promptInstalar) {
    abrirSheet(
      '<div class="sheet-head"><h2>Instalar no celular</h2>' +
        '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
      '<div class="note note-mut" style="margin-top:8px"><b>Se o Android disser que já está instalado</b>, ' +
        'é porque está mesmo: procure <b>Meu dinheiro</b> na gaveta de aplicativos ou na tela inicial. ' +
        'O Chrome esconde o convite de instalar quando o app já existe no aparelho.</div>' +
      '<p class="hint" style="margin-top:12px">Ainda não instalou? Abra este endereço no navegador ' +
        'do celular e use o menu:</p>' +
      '<div class="rows" style="margin-top:10px">' +
        '<div class="row"><span class="row-mid"><span class="row-t">Android / Chrome</span>' +
          '<span class="row-s">Menu ⋮ → <b>Adicionar à tela inicial</b> → Instalar</span></span></div>' +
        '<div class="row"><span class="row-mid"><span class="row-t">iPhone / Safari</span>' +
          '<span class="row-s">Compartilhar → <b>Adicionar à Tela de Início</b></span></span></div>' +
      '</div>' +
      '<div class="note note-mut" style="margin-top:12px">Depois de instalar, ele abre em tela cheia, ' +
        'sem barra de endereço, e funciona sem internet.</div>'
    );
    return;
  }
  var p = promptInstalar; promptInstalar = null;
  p.prompt();
  p.userChoice && p.userChoice.then ? p.userChoice.then(function(){ render(); }) : null;
}

/* ---------- service worker ---------- */
function registrarSW(){
  try {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    navigator.serviceWorker.register('sw.js').catch(function(){});
  } catch(e){}
}

/* ---------- partida ---------- */
try {
  window.addEventListener('beforeinstallprompt', function(ev){
    ev.preventDefault(); promptInstalar = ev; pintarNuvem();
  });
  /* outra aba do mesmo navegador gravou: esta acompanha em vez de divergir */
  window.addEventListener('storage', function(ev){
    if (!ev.key || ev.key.indexOf('meudinheiro.') !== 0) return;
    if (ev.key === 'meudinheiro.v2' && ev.newValue) {
      if (sheetAberto) return;
      try { F.setDB(F.normalizar(JSON.parse(ev.newValue))); } catch(e){ return; }
      var e2 = lerJSON(NK.est);
      if (e2.versao !== undefined) { N.versao = e2.versao; N.sujo = !!e2.sujo; N.existe = !!e2.existe; }
      render();
    } else if (ev.key === NK.est) {
      var e3 = lerJSON(NK.est);
      if (e3.versao !== undefined) { N.versao = e3.versao; N.sujo = !!e3.sujo; N.existe = !!e3.existe; }
      pintarNuvem();
    }
  });
  window.addEventListener('online',  function(){ nuvemSincronizar(true); });
  window.addEventListener('offline', function(){ if (nuvemLogada()) marcarNuvem('offline'); });
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) nuvemSincronizar(true);
  });
} catch(e){}

nuvemCarregarCfg();
carregar();
render();
registrarSW();
if (nuvemLogada()) setTimeout(function(){ nuvemSincronizar(true); }, 300);

try {
  window.Nuvem = {
    situacao: function(){
      return { estado:N.estado, versao:N.versao, sujo:N.sujo, existe:N.existe,
               email:N.email, dispositivo:N.dispositivo, ultimo:N.ultimo,
               url:N.url, tabela:N.tabela };
    },
    sincronizar: function(){ return nuvemSincronizar(); },
    enviar: function(){ clearTimeout(timerEnvio); return nuvemEnviarAgora(); },
    sair: nuvemSair
  };
} catch(e){}

})();


</script>
</body>
</html>
