/* =============================================================
   AGENDA — tudo que ainda vai acontecer, numa linha do tempo só.
   Fatura de cartão, conta prevista, pix parcelado, reposição de
   reserva, dívida com pessoa e dinheiro a receber moravam em
   quatro lugares diferentes. Agora moram aqui, ordenados por
   data, cada um com o seu botão de resolver do lado.
   ============================================================= */

/* quanto do empréstimo já foi quitado, para a linha contar a história inteira */
function jaAbatido(e, saldo, verbo){
  var principal = F.movsDoEmprestimo(e.id).filter(function(m){
    return m.tipo === 'emprestimo_concedido' || m.tipo === 'emprestimo_obtido';
  }).reduce(function(s,m){ return s + m.valor; }, 0);
  var pago = principal - saldo;
  return pago > 0 ? ' · já ' + verbo + ' ' + fmt(pago) : '';
}

function itensAgenda(){
  var D = F.getDB(), out = [];

  D.cartoes.forEach(function(c){
    F.faturasAbertas(c.id).forEach(function(f){
      out.push({ fluxo:'sai', data:f.vencimento, tipo:'fatura',
        titulo:'Fatura ' + c.nome, sub:'de ' + F.mesLabel(f.competencia, true),
        valor:f.aberto, cor:(c.cor || 'var(--com)'), ic:'cartao',
        abrir:{ act:'fatura-abrir', id:c.id, id2:f.competencia },
        acao:{ act:'fatura-pagar', id:c.id, id2:f.competencia, rotulo:'Pagar' } });
    });
  });

  F.previstosAbertos().forEach(function(p){
    var entra = p.tipo === 'receita';
    var tags = [];
    if (p.totalParcelas > 1) tags.push({ t:p.parcela + '/' + p.totalParcelas, cls:'t-com' });
    if (p.repete === 'mensal') tags.push({ t:'todo mês', cls:'t-mut' });
    out.push({ fluxo: entra ? 'entra' : 'sai', data:p.vencimento, tipo:'previsto', tags:tags,
      titulo:p.descricao || p.categoria || 'Conta prevista', sub:p.categoria || '',
      valor:p.valor, cor: entra ? 'var(--pos)' : 'var(--com)', ic: entra ? 'up' : 'pend',
      abrir:{ act:'prev-det', id:p.id },
      acao:{ act:'prev-confirmar', id:p.id, rotulo: entra ? 'Recebi' : 'Paguei' } });
  });

  F.emprestimosPorDirecao('obtido').forEach(function(e){
    var s = F.saldoEmprestimo(e);
    if (!s) return;
    out.push({ fluxo:'sai', data:e.prazo || '', semData:!e.prazo, tipo:'divida',
      titulo:'Devo a ' + e.pessoa, sub:(e.descricao || 'sem motivo anotado') + jaAbatido(e, s, 'paguei'),
      valor:s, cor:'var(--neg)', ic:'hand',
      abrir:{ act:'emp-det', id:e.id },
      acao:{ act:'emp-baixa', id:e.id, rotulo:'Paguei' } });
  });

  F.contasARepor().forEach(function(c){
    var nv = F.nivelConta(c);
    out.push({ fluxo:'sai', data:'', semData:true, tipo:'reposicao',
      titulo:'Repor ' + c.nome, sub:'reserva abaixo do patamar',
      valor:nv.falta, cor:'var(--res)', ic:'swap',
      abrir:{ act:'conta-nivel', id:c.id },
      acao:{ act:'repor-conta', id:c.id, rotulo:'Repor' } });
  });

  F.emprestimosPorDirecao('concedido').forEach(function(e){
    var s = F.saldoEmprestimo(e);
    if (!s) return;
    out.push({ fluxo:'entra', data:e.prazo || '', semData:!e.prazo, tipo:'receber',
      titulo:e.pessoa, sub:(e.descricao || 'sem motivo anotado') + jaAbatido(e, s, 'devolveu'),
      valor:s, cor:'var(--rec)', ic:'hand',
      abrir:{ act:'emp-det', id:e.id },
      acao:{ act:'emp-baixa', id:e.id, rotulo:'Recebi' } });
  });

  out.sort(function(a,b){
    if (a.semData !== b.semData) return a.semData ? 1 : -1;
    return String(a.data).localeCompare(String(b.data));
  });
  return out;
}

function quandoTexto(iso, semData){
  if (semData || !iso) return 'sem data marcada';
  var dias = F.diasEntre(F.hojeISO(), iso);
  if (dias < 0) return 'venceu há ' + Math.abs(dias) + (Math.abs(dias) === 1 ? ' dia' : ' dias');
  if (dias === 0) return 'vence hoje';
  if (dias === 1) return 'vence amanhã';
  if (dias <= 30) return 'vence em ' + dias + ' dias';
  return 'vence ' + F.dataCurta(iso);
}

function rowAgenda(x){
  var atrasado = !x.semData && x.data && x.data < F.hojeISO();
  var entra = x.fluxo === 'entra';
  return '<div class="ag-row">' +
    '<button class="ag-abrir" data-act="' + x.abrir.act + '" data-id="' + esc(x.abrir.id) + '"' +
      (x.abrir.id2 ? ' data-id2="' + esc(x.abrir.id2) + '"' : '') + '>' +
      '<span class="row-ic" style="background:' + x.cor + '">' + ico(x.ic,'width:15px;height:15px') + '</span>' +
      '<span class="ag-mid"><span class="row-t">' + esc(x.titulo) +
        (x.tags || []).map(function(g){ return ' <span class="tag ' + g.cls + '">' + esc(g.t) + '</span>'; }).join('') +
      '</span>' +
      '<span class="row-s"' + (atrasado ? ' style="color:var(--neg);font-weight:650"' : '') + '>' +
        (x.sub ? esc(x.sub) + ' · ' : '') + quandoTexto(x.data, x.semData) + '</span></span>' +
      '<span class="row-v num"' + (entra ? ' style="color:var(--pos)"' : '') + '>' +
        (entra ? '+ ' : '') + fmt(x.valor) + '</span>' +
    '</button>' +
    '<button class="ag-acao a-' + (x.tipo === 'reposicao' ? 'res' : entra ? 'pos'
          : x.tipo === 'divida' ? 'neg' : 'com') + '" data-act="' + x.acao.act +
      '" data-id="' + esc(x.acao.id) + '"' + (x.acao.id2 ? ' data-id2="' + esc(x.acao.id2) + '"' : '') +
      ' title="' + esc(x.acao.rotulo) + '">' +
      ico('check') + '<span>' + esc(x.acao.rotulo) + '</span></button>' +
  '</div>';
}

function grupoAgenda(titulo, arr, cor, limite){
  if (!arr.length) return '';
  var soma = arr.reduce(function(s,x){ return s + x.valor; }, 0);
  var mostra = arr, escondidos = 0;
  if (limite && arr.length > limite && !UI.agTudo) {
    mostra = arr.slice(0, limite);
    escondidos = arr.length - limite;
  }
  return '<div class="daygroup"><div class="dayhead">' +
      '<span class="d"' + (cor ? ' style="color:' + cor + '"' : '') + '>' + titulo + '</span>' +
      '<span class="t num">' + fmt(soma) + '</span></div>' +
    '<div class="rows">' + mostra.map(rowAgenda).join('') + '</div>' +
    (escondidos
      ? '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="ag-tudo">' +
        'mostrar mais ' + escondidos + (escondidos === 1 ? ' item' : ' itens') + '</button>'
      : (limite && UI.agTudo && arr.length > limite
          ? '<button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="ag-tudo">mostrar menos</button>'
          : '')) +
  '</div>';
}

function telaAgenda(){
  var todos = itensAgenda();
  var ind = F.indicadores();
  var hoje = F.hojeISO();
  var mes = UI.mes;
  var ehMesAtual = mes === F.mesAtual();
  var iniM = iniMes(mes), fimM = fimMes(mes);

  function atrasado(x){ return !x.semData && x.data < hoje; }
  function dentroDoMes(x){ return !x.semData && x.data >= iniM && x.data <= fimM; }

  /* o que conta no mês escolhido:
     · o que vence dentro dele
     · o que já venceu e continua em aberto (vai ter de ser pago de qualquer jeito)
     · o que não tem data, do lado que sai — repor e dívida sem prazo dependem de você
     Do lado que entra, o sem data fica de fora: dinheiro que ninguém marcou de
     devolver não é dinheiro deste mês. Ele continua listado em "Quem me deve". */
  var sai = todos.filter(function(x){
    return x.fluxo === 'sai' && (x.semData || atrasado(x) || dentroDoMes(x));
  });
  var entra = todos.filter(function(x){ return x.fluxo === 'entra'; });
  var entraNoMes = entra.filter(function(x){ return atrasado(x) || dentroDoMes(x); });
  var depois = todos.filter(function(x){
    return x.fluxo === 'sai' && !x.semData && x.data > fimM;
  });

  var totalSai = sai.reduce(function(s,x){ return s + x.valor; }, 0);
  var totalEntra = entraNoMes.reduce(function(s,x){ return s + x.valor; }, 0);

  /* de onde vem o valor que vai sair, para o número não ser uma caixa-preta */
  var porTipo = { fatura:0, previsto:0, divida:0, reposicao:0 };
  sai.forEach(function(x){ porTipo[x.tipo] = (porTipo[x.tipo] || 0) + x.valor; });
  var NOMES = { fatura:'fatura', previsto:'contas', divida:'pessoas', reposicao:'repor' };
  var composicao = ['fatura','previsto','divida','reposicao']
    .filter(function(k){ return porTipo[k] > 0; })
    .map(function(k){ return NOMES[k] + ' <b class="num">' + fmt(porTipo[k]) + '</b>'; })
    .join(' · ');

  var rotuloMes = F.mesLabel(mes);
  var mesCurto = rotuloMes.split(' de ')[0];
  var resumo =
    '<div class="ag-mes">' + seletorMes() + '</div>' +
    '<section class="card ag-resumo">' +
      '<div class="statrow">' +
        '<div><div class="eyebrow">Vai sair</div>' +
          '<div class="num com ag-n">' + fmt(totalSai) + '</div>' +
          '<div class="hint">em ' + esc(mesCurto) + (porTipo.reposicao > 0
            ? ', com o que falta repor' : ', contas e faturas') + '</div></div>' +
        '<div><div class="eyebrow">Vai entrar</div>' +
          '<div class="num pos ag-n">' + fmt(totalEntra) + '</div>' +
          '<div class="hint">em ' + esc(mesCurto) + (entra.length > entraNoMes.length
            ? ', só o que tem data' : '') + '</div></div>' +
        '<div><div class="eyebrow">Disponível hoje</div>' +
          '<div class="num ag-n" style="color:' + (ind.disponivel >= 0 ? 'var(--ink)' : 'var(--neg)') + '">' +
            fmt(ind.disponivel) + '</div>' +
          '<div class="hint">descontando tudo que vai sair</div></div>' +
      '</div>' +
      (composicao ? '<div class="ag-composicao">' + composicao + '</div>' : '') +
    '</section>';

  var atrasadas = sai.filter(atrasado);
  var semPrazo = sai.filter(function(x){ return x.semData; });
  var doMes = sai.filter(dentroDoMes);

  var corpoMes;
  if (ehMesAtual) {
    var d7 = F.fromISO(hoje); d7.setDate(d7.getDate() + 7);
    var lim7 = F.toISO(d7);
    corpoMes = grupoAgenda('Próximos 7 dias', doMes.filter(function(x){ return x.data <= lim7; })) +
               grupoAgenda('Ainda este mês', doMes.filter(function(x){ return x.data > lim7; }));
  } else {
    corpoMes = grupoAgenda('Em ' + rotuloMes, doMes);
  }

  var corpoSai = (sai.length
    ? grupoAgenda('Venceu', atrasadas, 'var(--neg)') +
      corpoMes +
      grupoAgenda('Sem data marcada', semPrazo)
    : vazio('check','Nada marcado para ' + rotuloMes,
        'Faturas, contas previstas, parcelas e reposições aparecem aqui assim que caírem neste mês.')) +
    grupoAgenda('Depois de ' + mesCurto, depois, '', 3);

  var somaReceber = entra.reduce(function(s,x){ return s + x.valor; }, 0);
  var corpoEntra = entra.length
    ? '<div class="secao-ag"><div class="dayhead" style="padding-left:0">' +
        '<span class="d" style="font-size:14px;font-weight:700;color:var(--ink)">Quem me deve</span>' +
        '<span class="t num rec">' + fmt(somaReceber) + '</span></div>' +
        '<div class="rows">' + entra.map(rowAgenda).join('') + '</div></div>'
    : '';

  var quitados = '';
  if (UI.agQuitados) {
    var fechados = F.emprestimosPorDirecao('concedido').concat(F.emprestimosPorDirecao('obtido'))
      .filter(function(e){ return F.saldoEmprestimo(e) === 0; });
    quitados = '<div class="secao-ag"><h2>Já quitados</h2>' +
      (fechados.length
        ? '<div class="rows">' + fechados.map(function(e){
            return '<button class="row" data-act="emp-det" data-id="' + e.id + '">' +
              '<span class="row-ic" style="background:var(--pos)">' + ico('check','width:15px;height:15px') + '</span>' +
              '<span class="row-mid"><span class="row-t">' + esc(e.pessoa) + '</span>' +
              '<span class="row-s">' + esc(e.descricao || 'sem motivo anotado') + '</span></span>' +
              '<span class="row-v num pos">quitado</span></button>';
          }).join('') + '</div>'
        : '<p class="hint">Nenhum empréstimo quitado ainda.</p>') + '</div>';
  }

  var acoes =
    '<div class="secao-ag"><h2>Registrar outra coisa</h2>' +
    '<div class="btnrow ag-botoes">' +
      '<button class="btn btn-ghost" data-act="novo-previsto">' + ico('pend') + ' Prever uma conta</button>' +
      '<button class="btn btn-ghost" data-act="novo-emprestimo">' + ico('hand') + ' Emprestei a alguém</button>' +
      '<button class="btn btn-ghost" data-act="novo-divida">' + ico('down') + ' Peguei emprestado</button>' +
      '<button class="btn btn-ghost" data-act="ag-quitados">' +
        (UI.agQuitados ? 'Esconder quitados' : 'Ver quitados') + '</button>' +
    '</div></div>';

  return resumo + corpoSai + corpoEntra + quitados + acoes;
}

   METAS

function telaMetas(){
  var D = F.getDB();
  if (!D.metas.length) {
    return vazio('meta','Nenhuma meta ainda',
      'Diga quanto quer juntar e até quando. Se o dinheiro já fica numa conta separada, é só ligar a conta à meta — o progresso anda sozinho.',
      'meta-nova','Criar meta');
  }
  var total = F.totalReservado();
  var alvo = D.metas.reduce(function(s,m){ return s + (m.alvo||0); }, 0);
  var proj = F.totalAReceberNasMetas();
  var comProj = total + proj;

  return '<section class="hero">' +
      '<div class="eyebrow">Reservado nas metas</div>' +
      '<div class="hero-v num res">' + fmt(total) + '</div>' +
      '<div style="font-size:12.5px;color:var(--ink-3);margin-top:5px">' +
        'continua sendo seu patrimônio — só não entra no disponível do dia a dia</div>' +
      (alvo ? '<div class="bar" style="margin-top:14px;height:9px">' +
          '<span style="width:' + Math.min(100, total/alvo*100).toFixed(1) + '%;background:var(--res)"></span>' +
          (proj ? '<span class="proj" style="width:' +
            Math.max(0, Math.min(100 - total/alvo*100, proj/alvo*100)).toFixed(1) + '%"></span>' : '') +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:5px">' +
        '<span class="num">somando as metas: ' + fmt(alvo) + '</span>' +
        '<span class="num">faltam ' + fmt(Math.max(0, alvo-total)) + '</span></div>' : '') +
      (!proj && F.totalAReceber() > 0 && D.metas.length
        ? '<div class="note" style="background:var(--rec-bg);color:var(--rec);margin-top:12px;' +
            'display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
            '<span style="flex:1;min-width:200px">' + ico('hand','width:13px;height:13px;vertical-align:-2px') +
            ' Você tem <b>' + fmt(F.totalAReceber()) + '</b> a receber de outras pessoas. ' +
            'Quer ver onde a meta chegaria se todos pagassem?</span>' +
            '<button class="btn btn-sm" style="background:var(--rec);color:var(--on-rec)" ' +
              'data-act="meta-receber" data-id="' + D.metas[0].id + '">Mostrar na meta</button>' +
          '</div>'
        : '') +
      (proj
        ? '<div class="note" style="background:var(--rec-bg);color:var(--rec);margin-top:12px">' +
            ico('hand','width:13px;height:13px;vertical-align:-2px') +
            ' Com os <b>' + fmt(proj) + '</b> que têm a receber, a meta chegaria a <b>' + fmt(comProj) + '</b>' +
            (alvo ? ' — <b>' + Math.floor(Math.min(100, comProj/alvo*100)) + '%</b> do objetivo' : '') + '. ' +
            '<span style="opacity:.8">É projeção: esse dinheiro ainda não voltou, então não entra no patrimônio.</span>' +
          '</div>'
        : '') +
    '</section>' +
    '<button class="btn btn-primary btn-nova" style="margin-top:14px" data-act="meta-nova">' + ico('plus') + ' Nova meta</button>' +
    D.metas.map(function(m){
      var p = F.metaProgresso(m);
      var vinc = F.metaVinculada(m);
      return '<section class="card">' +
        '<button data-act="meta-det" data-id="' + m.id + '" style="display:block;width:100%">' +
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">' +
            '<span style="font-size:16px;font-weight:700;letter-spacing:-.015em">' + esc(m.nome) + '</span>' +
            '<span style="white-space:nowrap">' +
              (p.semAlvo ? '' : '<span class="num res" style="font-weight:720">' + Math.floor(p.percentual) + '%</span>') +
              (p.aReceber && !p.semAlvo ? '<span class="num rec" style="font-weight:700;font-size:12.5px;margin-left:7px">' +
                Math.floor(p.percentualComReceber) + '% com o a receber</span>' : '') +
            '</span>' +
          '</div>' +
          (p.semAlvo ? '' : '<div class="bar" style="margin-top:9px;height:9px">' +
            '<span style="width:' + p.percentual.toFixed(1) + '%;background:' +
              (p.concluida ? 'var(--pos)' : 'var(--res)') + '"></span>' +
            (p.aReceber ? '<span class="proj" style="width:' +
              Math.max(0, p.percentualComReceber - p.percentual).toFixed(1) + '%"></span>' : '') +
          '</div>') +
          '<div class="meta-linha">' +
            '<span class="num"><b style="color:var(--ink)">' + fmt(p.acumulado) + '</b>' +
              (p.semAlvo ? ' guardados' : ' de ' + fmt(p.alvo)) + '</span>' +
            '<span>' + (vinc ? F.contasDaMeta(m).map(function(c){ return esc(c.nome); }).join(' + ') : 'sem conta vinculada') + '</span>' +
          '</div>' +
          (p.aReceber
            ? '<div style="margin-top:8px;font-size:12.5px" class="rec">' +
                '+ ' + fmt(p.aReceber) + ' a receber → <b>' + fmt(p.comReceber) + '</b>' +
                (p.faltaComReceber ? ' <span style="opacity:.75">· ainda faltariam ' + fmt(p.faltaComReceber) + '</span>'
                                   : ' <span style="opacity:.75">· fecharia a meta</span>') +
              '</div>'
            : '') +
          '<div style="margin-top:10px">' +
            (p.concluida ? '<span class="tag t-pos">' + ico('check') + ' Meta alcançada</span>'
             : p.porMes ? '<span class="tag t-res">Guarde ' + fmt(p.porMes) + ' por mês</span>' +
                 '<span class="mut" style="font-size:12px;margin-left:7px">até ' + F.dataCurta(m.prazo) + '</span>'
             : p.semAlvo ? '<span class="tag t-mut">sem valor definido</span>'
             : '<span class="mut" style="font-size:12px">faltam ' + fmt(p.falta) + '</span>') +
          '</div>' +
        '</button>' +
        (vinc ? '' :
          '<div class="note note-res" style="margin-top:11px">Esta meta ainda não tem conta ligada. ' +
            'Ligando as contas onde você guarda o dinheiro, o progresso passa a subir e descer sozinho.</div>') +
        '<div class="btnrow">' +
          '<button class="btn btn-ghost btn-sm" data-act="meta-det" data-id="' + m.id + '">Detalhes</button>' +
          (F.totalAReceber() > 0
            ? '<button class="btn btn-sm" data-act="meta-receber" data-id="' + m.id + '" style="' +
                (m.incluirAReceber ? 'background:var(--rec-bg);color:var(--rec);border:1px solid transparent'
                                   : 'background:var(--surface);border:1px solid var(--line);color:var(--ink-2)') + '">' +
                ico('hand') + (m.incluirAReceber ? ' Ocultar a receber' : ' Somar o a receber') + '</button>'
            : '') +
          (vinc
            ? '<button class="btn btn-ghost btn-sm" data-act="meta-vincular" data-id="' + m.id + '">' +
                ico('conta') + ' Contas</button>' +
              '<button class="btn btn-primary btn-sm" data-act="novo-transferencia" data-id2="' + F.contasDaMeta(m)[0].id + '">' +
                ico('swap') + ' Transferir para a conta</button>'
            : '<button class="btn btn-ghost btn-sm" data-act="meta-aporte" data-id="' + m.id + '">' +
                ico('plus') + ' Reservar valor</button>' +
              '<button class="btn btn-primary btn-sm" data-act="meta-vincular" data-id="' + m.id + '">' +
                ico('conta') + ' Vincular contas</button>') +
        '</div>' +
      '</section>';
    }).join('');
}

/* =============================================================
   RELATÓRIOS
   ============================================================= */
function telaRelatorios(){
  var f = faixaPeriodo(UI.relPeriodo, UI.relDe, UI.relAte);
  var r = F.resumoPeriodo(f.de, f.ate);
  var meses = F.porMes(f.de, f.ate);
  var nMeses = Math.max(1, meses.length);

  var seletor =
    '<section class="card">' +
      '<div class="chips">' + PERIODOS.map(function(p){
        return '<button class="chip" data-act="rel-periodo" data-id="' + p.id + '" aria-pressed="' +
          (UI.relPeriodo===p.id) + '">' + p.nome + '</button>';
      }).join('') + '</div>' +
      (UI.relPeriodo === 'custom'
        ? '<div class="row-2" style="margin-top:10px">' +
            '<div><label class="eyebrow" for="rDe">De</label><input class="input" type="date" id="rDe" value="' + esc(UI.relDe) + '"></div>' +
            '<div><label class="eyebrow" for="rAte">Até</label><input class="input" type="date" id="rAte" value="' + esc(UI.relAte) + '"></div>' +
          '</div>' : '') +
      '<div class="hint" style="margin-top:9px">Analisando ' + F.dataCurta(f.de) + ' a ' + F.dataCurta(f.ate) +
        ' · compras no cartão entram no mês de cada parcela</div>' +
    '</section>';

  if (!r.despesas.length && !r.receitas.length) {
    return seletor + vazio('rel','Sem dados neste período','Escolha outro intervalo ou registre movimentações.');
  }

  var topo =
    '<div class="tiles" style="grid-template-columns:repeat(2,1fr)">' +
      '<div class="tile"><div class="l">Receitas</div><div class="v num pos">' + fmt(r.totalReceitas) + '</div>' +
        '<div class="s">média ' + fmt(Math.round(r.totalReceitas/nMeses)) + '/mês</div></div>' +
      '<div class="tile"><div class="l">Despesas</div><div class="v num neg">' + fmt(r.totalDespesas) + '</div>' +
        '<div class="s">média ' + fmt(Math.round(r.totalDespesas/nMeses)) + '/mês</div></div>' +
      '<div class="tile"><div class="l">Saldo</div><div class="v num" style="color:' +
        (r.saldo>=0?'var(--ink)':'var(--neg)') + '">' + fmt(r.saldo) + '</div>' +
        '<div class="s">' + (r.totalReceitas ? Math.round(r.saldo/r.totalReceitas*100) + '% do que entrou' : '—') + '</div></div>' +
      '<div class="tile"><div class="l">Lançamentos</div><div class="v num">' +
        (r.despesas.length + r.receitas.length) + '</div><div class="s">no período</div></div>' +
    '</div>';

  /* evolução mensal */
  var maxMes = meses.reduce(function(m,x){ return Math.max(m, x.despesas, x.receitas); }, 0) || 1;
  var W = 680, H = 170, base = H - 28, topo2 = 10;
  var g = W / Math.max(1, meses.length);
  var barras = meses.map(function(x,i){
    var cx = g*i + g/2, bw = Math.min(22, g/3.2);
    var hr = (x.receitas/maxMes)*(base-topo2), hd = (x.despesas/maxMes)*(base-topo2);
    return '<rect x="' + (cx-bw-2) + '" y="' + (base-hr) + '" width="' + bw + '" height="' + Math.max(hr,2) + '" rx="3" fill="var(--pos)"/>' +
           '<rect x="' + (cx+2) + '" y="' + (base-hd) + '" width="' + bw + '" height="' + Math.max(hd,2) + '" rx="3" fill="var(--neg)"/>' +
           '<text x="' + cx + '" y="' + (base+15) + '" text-anchor="middle">' + F.mesLabel(x.mes, true) + '</text>';
  }).join('');
  var grafico =
    '<section class="card"><div class="card-head"><h2>Mês a mês</h2>' +
      '<span class="mut" style="font-size:11.5px"><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--pos)"></span> receitas ' +
      '<span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--neg);margin-left:8px"></span> despesas</span></div>' +
      '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" style="height:170px">' +
        '<line x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '" stroke="var(--line)" stroke-width="1"/>' + barras +
      '</svg>' +
      '<div class="tbl-rola" style="margin-top:8px"><table class="tbl"><thead><tr><th>Mês</th><th class="r">Receitas</th><th class="r">Despesas</th><th class="r">Saldo</th></tr></thead><tbody>' +
      meses.slice().reverse().map(function(x){
        return '<tr><td style="text-transform:capitalize">' + F.mesLabel(x.mes) + '</td>' +
          '<td class="r num pos">' + fmt(x.receitas) + '</td>' +
          '<td class="r num neg">' + fmt(x.despesas) + '</td>' +
          '<td class="r num" style="color:' + (x.saldo>=0?'var(--ink)':'var(--neg)') + ';font-weight:650">' + fmt(x.saldo) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
    '</section>';

  /* por categoria com drill-down */
  function tabelaCat(lista, total, titulo, tipo){
    var cats = F.somaPor(lista, 'categoria');
    if (!cats.length) return '';
    return '<section class="card"><div class="card-head"><h2>' + titulo + '</h2>' +
      '<span class="num mut" style="font-size:12.5px">' + fmt(total) + '</span></div>' +

        return '<button data-act="drill-cat" data-id="' + esc(c.chave) + '" data-id2="' + tipo + '" ' +
          'style="display:block;width:100%;padding:8px 0">' +

          '<div class="bar"><span style="width:' + pc.toFixed(1) + '%;background:' + info.cor + '"></span></div></button>';
      }).join('') + '</section>';
  }

  /* por conta e por forma de pagamento */
  var porConta = F.somaPor(r.despesas.filter(function(x){ return x.contaId; }), 'contaId');
  var porCartao = F.somaPor(r.despesas.filter(function(x){ return x.cartaoId; }), 'cartaoId');

    '<section class="card"><div class="card-head"><h2>Onde o gasto passou</h2></div>' +

      porConta.map(function(x){

          '<td class="r num">' + fmt(x.total) + '</td></tr>';
      }).join('') +
      porCartao.map(function(x){
        return '<tr><td>' + esc(nomeCartao(x.chave)) + ' <span class="tag t-com">cartão</span></td>' +
          '<td class="r num">' + fmt(x.total) + '</td></tr>';
      }).join('') +
      '</tbody></table></div></section>';

  /* evolução do patrimônio */
  var ev = F.evolucaoPatrimonio(Math.min(12, Math.max(3, meses.length)));
  var maxP = ev.reduce(function(m,x){ return Math.max(m, Math.abs(x.valor)); }, 0) || 1;
  var pts = ev.map(function(x,i){
    return (i/(Math.max(1,ev.length-1))*640+20).toFixed(1) + ',' + (130 - (x.valor/maxP)*100).toFixed(1);
  }).join(' ');
  var patBloco =
    '<section class="card"><div class="card-head"><h2>Evolução do patrimônio</h2>' +
      '<span class="num mut" style="font-size:12.5px">' + fmt(ev[ev.length-1].valor) + '</span></div>' +
      '<svg class="chart" viewBox="0 0 680 150" preserveAspectRatio="xMidYMid meet" style="height:150px">' +
        '<polyline points="' + pts + '" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>' +
        ev.map(function(x,i){
          var cx = (i/(Math.max(1,ev.length-1))*640+20), cy = 130 - (x.valor/maxP)*100;
          return '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="3" fill="var(--brand)"/>' +
            '<text x="' + cx.toFixed(1) + '" y="146" text-anchor="middle">' + F.mesLabel(x.mes, true) + '</text>';
        }).join('') +
      '</svg></section>';

  /* compromissos futuros */
  var futuros = proximosCompromissos(0);
  var futBloco = futuros.length
    ? '<section class="card"><div class="card-head"><h2>Compromissos à frente</h2>' +
        '<span class="num mut" style="font-size:12.5px">' +
        fmt(futuros.filter(function(x){ return x.tipo!=='receita'; }).reduce(function(s,x){ return s+x.valor; },0)) + '</span></div>' +
        '<div class="tbl-rola"><table class="tbl"><thead><tr><th>Vencimento</th><th>O quê</th><th class="r">Valor</th></tr></thead><tbody>' +
        futuros.slice(0,12).map(function(x){
          return '<tr><td class="num">' + F.dataCurta(x.data) + '</td><td>' + esc(x.titulo) +
            ' <span class="mut">· ' + esc(x.sub) + '</span></td><td class="r num">' + fmt(x.valor) + '</td></tr>';
        }).join('') + '</tbody></table></div></section>'
    : '';

  var exportar =
    '<section class="card"><div class="card-head"><h2>Levar para a planilha</h2></div>' +
      '<p class="hint" style="margin:0 0 11px">CSV com separador ponto e vírgula, abre direto no Excel brasileiro.</p>' +
      '<div class="btnrow" style="margin-top:0">' +
        '<button class="btn btn-ghost btn-sm" data-act="csv-mov">' + ico('file') + ' Movimentações</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="csv-cat">' + ico('file') + ' Resumo por categoria</button>' +
      '</div></section>';

  return seletor + topo +
    '<div class="grid grid-2" style="margin-top:14px">' +
      '<div>' + tabelaCat(r.despesas, r.totalDespesas, 'Para onde foi o dinheiro', 'despesa') + ondeBloco + '</div>' +
      '<div>' + tabelaCat(r.receitas, r.totalReceitas, 'De onde veio o dinheiro', 'receita') + patBloco + '</div>' +
    '</div>' + grafico + futBloco + exportar;
}

/* tipo de categoria que o formulário está pedindo agora */
function tipoCategoriaDe(d){
  if (d.tipo === 'receita') return 'receita';
  if (d.tipo === 'previsto') return d.prevTipo;
  return 'despesa';
}
/* vencimento da parcela i (0-based) conforme a periodicidade */
function dataParcela(baseISO, i, cada){
  var d = F.fromISO(baseISO);
  if (cada === 'quinzenal') { d.setDate(d.getDate() + 15*i); return F.toISO(d); }
  if (cada === 'semanal')   { d.setDate(d.getDate() + 7*i);  return F.toISO(d); }
  return F.diaNoMes(F.addMeses(F.mesKey(baseISO), i), d.getDate());
}
var PERIODICIDADES = [['mensal','todo mês'],['quinzenal','a cada 15 dias'],['semanal','toda semana']];

function contaPadrao(){
  var D = F.getDB();
  var ult = D.config && D.config.ultimaConta ? F.conta(D.config.ultimaConta) : null;
  if (ult) return ult;
  return D.contas.filter(function(c){ return c.tipo === 'corrente'; })[0] || D.contas[0];
}

/* aviso quando o dinheiro sai de uma conta acompanhada: o buraco é automático */
function blocoReserva(c, valor){
  if (!c || !F.acompanhaNivel(c)) return '';
  var nv = F.nivelConta(c);
  var futuro = valor ? Math.max(0, nv.nivel - (nv.saldo - valor)) : nv.falta;
  return '<div class="note note-res" style="margin-top:12px">' +
    '<b>' + esc(c.nome) + ' é conta de reserva.</b> ' +
    (valor
      ? 'Depois disso o saldo fica em ' + fmt(nv.saldo - valor) + ', abaixo do patamar de ' + fmt(nv.nivel) +
        ' — vai aparecer <b>' + fmt(futuro) + ' a repor</b>, sem você precisar anotar nada.'
      : 'O que sair daqui aparece sozinho em “A repor”.') +
  '</div>';
}

function formMov(tipo, opts){
  opts = opts || {};
  var D = F.getDB();
  if (!D.contas.length) { toast('Cadastre uma conta primeiro'); formConta(null); return; }

  var d = {
    tipo: tipo || 'despesa',
    valor: opts.valor || 0,
    data: opts.data || F.hojeISO(),
    contaId: opts.contaId || (contaPadrao()||{}).id,
    contaOrigemId: opts.contaOrigemId || (contaPadrao()||{}).id,
    contaDestinoId: opts.contaDestinoId || '',
    cartaoId: opts.cartaoId || '',
    pagarCom: opts.cartaoId ? 'cartao:' + opts.cartaoId : 'conta:' + ((contaPadrao()||{}).id),
    parcelas: 1,
    categoria: '', descricao: '', obs: '', forma: '',
    direcao: opts.direcao || 'concedido', pessoa: '', prazo: '', contaEmp: opts.contaId || '',
    prevTipo: 'despesa', vencimento: F.diaNoMes(F.addMeses(F.mesAtual(),1), 10), repete: '',
    prevParcelas: 1, prevCada: 'mensal', prevBase: 'parcela'
  };
  var editando = opts.editar || null;
  if (editando) {
    d.tipo = editando.tipo === 'despesa' || editando.tipo === 'receita' || editando.tipo === 'transferencia'
      ? editando.tipo : editando.tipo;
    d.valor = editando.valor; d.data = editando.data;
    d.contaId = editando.contaId || d.contaId;
    d.contaOrigemId = editando.contaOrigemId || d.contaOrigemId;
    d.contaDestinoId = editando.contaDestinoId || '';
    d.cartaoId = editando.cartaoId || '';
    d.pagarCom = editando.cartaoId ? 'cartao:' + editando.cartaoId : 'conta:' + (editando.contaId||'');
    d.parcelas = editando.parcelas || 1;
    d.categoria = editando.categoria || ''; d.descricao = editando.descricao || '';
    d.obs = editando.obs || ''; d.forma = editando.forma || '';
  }

  var titulo = editando ? 'Editar lançamento' : 'Novo lançamento';
  abrirSheet(
    '<div class="sheet-head"><h2>' + titulo + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    (editando ? '' :
      '<div class="seg tipos" id="segTipo" style="margin-top:10px">' +
        TIPOS_MOV.map(function(t){
          return '<button type="button" data-v="' + t.id + '" aria-pressed="' + (d.tipo===t.id) + '">' +
            ico(t.ic) + '<span>' + t.nome + '</span></button>';
        }).join('') +
      '</div>') +
    '<div id="campos"></div>' +
    '<div class="erros" id="erros"></div>' +
    '<div class="sheet-actions">' +
      (editando
        ? '<button class="btn btn-danger" style="flex:0 0 52px" data-act="mov-apagar" data-id="' + editando.id + '" aria-label="Apagar">' + ico('trash') + '</button>'
        : '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>') +
      '<button class="btn btn-primary" id="btnSalvar">' + (editando ? 'Salvar' : 'Registrar') + '</button>' +
    '</div>',
    function(){
      var segT = el('segTipo');
      if (segT) segT.addEventListener('click', function(ev){
        var b = ev.target.closest('button[data-v]'); if (!b) return;
        d.tipo = b.getAttribute('data-v'); d.categoria = '';
        Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
          x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === d.tipo));
        });
        pintar();
      });
      pintar();
      el('btnSalvar').addEventListener('click', function(){ salvarMov(d, editando); });

        el('campos').innerHTML = camposDoTipo(d);
        ligarMoeda(el('fValor'), function(c){ d.valor = c; atualizarExtras(); });
        var cats = el('fCats');
        if (cats) cats.addEventListener('click', function(ev){
          if (ev.target.closest('button[data-nova-cat]')) { abrirNovaCategoria(); return; }
          var b = ev.target.closest('button[data-cat]'); if (!b) return;
          d.categoria = b.getAttribute('data-cat');
          Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
            x.setAttribute('aria-pressed', String(x.getAttribute('data-cat') === d.categoria));
          });
        });

        function abrirNovaCategoria(){
          var caixa = el('novaCat');
          if (!caixa) return;
          caixa.innerHTML =
            '<div style="display:flex;gap:8px;align-items:flex-end">' +
              '<div class="field" style="flex:1;margin:0"><label for="ncNova">Nome da categoria</label>' +
                '<input class="input" id="ncNova" placeholder="Ex.: Barbearia, Faculdade"></div>' +
              '<button type="button" class="btn btn-primary" id="btnNovaCat" style="height:46px">Criar</button>' +
              '<button type="button" class="btn btn-ghost" id="btnNovaCatX" style="height:46px">Cancelar</button>' +
            '</div><div class="hint" id="ncErro"></div>';
          var campo = el('ncNova');
          campo.focus();
          campo.addEventListener('keydown', function(ev2){ if (ev2.key === 'Enter') { ev2.preventDefault(); criar(); } });
          el('btnNovaCatX').addEventListener('click', function(){ caixa.innerHTML = ''; });
          el('btnNovaCat').addEventListener('click', criar);
          function criar(){
            var tipoCat = tipoCategoriaDe(d);
            var nome = campo.value.trim();
            if (!nome) { el('ncErro').textContent = 'Escreva o nome da categoria.'; return; }
            var lista = F.getDB().categorias[tipoCat];
            if (lista.some(function(c){ return c.nome.toLowerCase() === nome.toLowerCase(); })) {
              el('ncErro').textContent = 'Já existe uma categoria com esse nome.'; return;
            }
            lista.push({ nome:nome, cor:F.PAL[lista.length % F.PAL.length] });
            salvar();
            d.categoria = nome;
            caixa.innerHTML = '';
            el('fCats').innerHTML = gridCategorias(tipoCat, d.categoria);
            toast('Categoria criada');
          }
        }
        var segB = el('segBase');
        if (segB) segB.addEventListener('click', function(ev){
          var b = ev.target.closest('button[data-v]'); if (!b) return;
          d.prevBase = b.getAttribute('data-v');
          Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
            x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === d.prevBase));
          });
          atualizarExtras();
        });
        ['fPrevParcelas','fPrevCada'].forEach(function(id){
          var n = el(id);
          if (n) n.addEventListener('change', function(){
            var antes = d.prevParcelas;
            d.prevParcelas = parseInt(el('fPrevParcelas').value,10) || 1;
            d.prevCada = el('fPrevCada').value;
            /* o formulário muda de forma ao virar parcelado */
            if ((antes > 1) !== (d.prevParcelas > 1)) pintar(); else atualizarExtras();
          });
        });
        var vencIn = el('fVenc');
        if (vencIn) vencIn.addEventListener('change', function(){ d.vencimento = vencIn.value; atualizarExtras(); });
        ['fPagarCom','fConta','fOrigem','fDestino','fParcelas','fDirecao'].forEach(function(id){
          var n = el(id);
          if (n) n.addEventListener('change', function(){ sincronizar(); atualizarExtras(); });
        });
        var seg = el('segDirecao');
        if (seg) seg.addEventListener('click', function(ev){
          var b = ev.target.closest('button[data-v]'); if (!b) return;
          d.direcao = b.getAttribute('data-v');
          Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
            x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === d.direcao));
          });
          pintar();
        });
        var segP = el('segPrev');
        if (segP) segP.addEventListener('click', function(ev){
          var b = ev.target.closest('button[data-v]'); if (!b) return;
          d.prevTipo = b.getAttribute('data-v'); d.categoria = '';
          pintar();
        });
        atualizarExtras();
      }
      function sincronizar(){
        if (el('fPagarCom')) {
          var v = el('fPagarCom').value.split(':');
          d.pagarCom = el('fPagarCom').value;
          if (v[0] === 'cartao') { d.cartaoId = v[1]; d.contaId = ''; }
          else { d.cartaoId = ''; d.contaId = v[1]; }
          var p = el('fParcelasWrap');
          if (p) p.style.display = d.cartaoId ? '' : 'none';
        }
        if (el('fConta')) {
          if (d.tipo === 'emprestimo') d.contaEmp = el('fConta').value;
          else d.contaId = el('fConta').value;
        }
        if (el('fOrigem')) d.contaOrigemId = el('fOrigem').value;
        if (el('fDestino')) d.contaDestinoId = el('fDestino').value;
        if (el('fParcelas')) d.parcelas = parseInt(el('fParcelas').value,10) || 1;
      }
      function atualizarExtras(){
        sincronizar();
        var alvo = el('extras');
        if (!alvo) return;
        var html = '';
        /* aviso de conta de reserva */
        var contaEmp = d.tipo === 'emprestimo' ? d.contaEmp : '';
        var origem = d.tipo === 'transferencia' ? F.conta(d.contaOrigemId)
                   : (d.tipo === 'despesa' && !d.cartaoId) ? F.conta(d.contaId)
                   : (d.tipo === 'emprestimo' && d.direcao === 'concedido' && contaEmp) ? F.conta(contaEmp) : null;
        var destino = d.tipo === 'transferencia' ? F.conta(d.contaDestinoId) : null;
        if (origem && F.acompanhaNivel(origem) && !(destino && F.acompanhaNivel(destino)) && !editando) {
          html += blocoReserva(origem, d.valor);
        }
        /* simulação das parcelas */
        if (d.tipo === 'despesa' && d.cartaoId && d.valor) {
          var cart = F.cartao(d.cartaoId);
          var sim = F.parcelasDaCompra({ id:'x', valor:d.valor, data:d.data, cartaoId:d.cartaoId, parcelas:d.parcelas });
          if (cart && sim.length) {
            html += '<div class="note note-com">' +
              (sim.length > 1
                ? '<b>' + sim.length + 'x de ' + fmt(sim[0].valor) + '</b>, da fatura de ' +
                  F.mesLabel(sim[0].competencia) + ' até ' + F.mesLabel(sim[sim.length-1].competencia) + '.'
                : '<b>Entra na fatura de ' + F.mesLabel(sim[0].competencia) + '</b>, que vence ' +
                  F.dataCurta(F.vencimentoFatura(cart, sim[0].competencia)) + '.') +
              ' Não sai da conta agora — vira despesa no mês de cada parcela.</div>';
          }
        }
        /* empréstimo sem conta: só registra a dívida, sem mexer em saldo */
        if (d.tipo === 'emprestimo' && !contaEmp) {
          html += '<div class="note note-mut">Nenhuma conta será movimentada. ' +
            (d.direcao === 'concedido'
              ? 'O valor entra apenas como <b>a receber</b>.'
              : 'O valor entra apenas como <b>dívida sua</b>.') +
            ' Use quando o dinheiro já saiu ou entrou antes de você começar a usar o app.</div>';
        }
        /* simulação do pix parcelado */
        if (d.tipo === 'previsto' && d.prevParcelas > 1 && d.valor) {
          var venc0 = (el('fVenc')||{}).value || d.vencimento;
          var n = d.prevParcelas;
          var totalGeral = d.prevBase === 'parcela' ? d.valor * n : d.valor;
          var pri = d.prevBase === 'parcela' ? d.valor : F.valorParcela(totalGeral, n, 1);
          var ult = dataParcela(venc0, n-1, d.prevCada);
          html += '<div class="note note-com">' +
            '<b>' + n + 'x de ' + fmt(pri) + '</b>' +
            (d.prevBase === 'total' && F.valorParcela(totalGeral,n,1) !== F.valorParcela(totalGeral,n,n)
              ? ' (a última sai ' + fmt(F.valorParcela(totalGeral,n,n)) + ')' : '') +
            ', de ' + F.dataCurta(venc0) + ' até ' + F.dataCurta(ult) + '. ' +
            'Total <b>' + fmt(totalGeral) + '</b>, ' +
            (PERIODICIDADES.filter(function(p){ return p[0] === d.prevCada; })[0]||['','']) [1] + '. ' +
            'Cada parcela entra como conta a pagar na data dela.</div>';
        }
        /* resumo da transferência */
        if (d.tipo === 'transferencia' && d.valor && origem && destino) {
          html += '<div class="note note-mut"><b>' + fmt(d.valor) + '</b> saem de <b>' + esc(origem.nome) +
            '</b> e entram em <b>' + esc(destino.nome) + '</b>. Seu patrimônio não muda — não é gasto nem receita.' +
            (d.valor > F.saldoConta(origem) ? ' <span class="neg">Atenção: passa do saldo registrado nessa conta.</span>' : '') +
            '</div>';
        }
        alvo.innerHTML = html;
      }
    }
  );
}

/* ---------- gravação ---------- */
function salvarMov(d, editando){
  var D = F.getDB();
  var erros = [];
  var valor = F.digitsToCents((el('fValor')||{}).value || '');
  var data = (el('fData')||{}).value || d.data;
  var desc = (el('fDesc')||{}).value || '';
  var obs = (el('fObs')||{}).value || '';

  function mostrar(lista){
    el('erros').innerHTML = lista.length
      ? '<ul>' + lista.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' : '';
  }

  /* --- previsto não entra no razão --- */
  if (d.tipo === 'previsto') {
    var venc = (el('fVenc')||{}).value;
    var nParc = parseInt((el('fPrevParcelas')||{}).value, 10) || 1;
    var cada = (el('fPrevCada')||{}).value || 'mensal';
    if (!valor) erros.push('Informe o valor previsto.');
    if (!venc) erros.push('Escolha o vencimento.');
    if (!d.categoria) erros.push('Escolha uma categoria.');
    if (erros.length) return mostrar(erros);
    marcar();
    var comum = { tipo:d.prevTipo, categoria:d.categoria, descricao:desc.trim(), obs:'',
                  contaId:'', cartaoId:'', criadoEm:new Date().toISOString() };
    if (nParc <= 1) {
      D.previstos.push(Object.assign({ id:F.uid(), valor:valor, vencimento:venc,
        repete: el('fRepete') && el('fRepete').checked ? 'mensal' : '' }, comum));
      toast('Previsão anotada', true);
    } else {
      /* parcelado: uma conta a pagar por parcela, cada uma com sua data */
      var totalGeral = d.prevBase === 'parcela' ? valor * nParc : valor;
      var serie = F.uid();
      for (var k = 1; k <= nParc; k++) {
        D.previstos.push(Object.assign({ id:F.uid(),
          valor: d.prevBase === 'parcela' ? valor : F.valorParcela(totalGeral, nParc, k),
          vencimento: dataParcela(venc, k-1, cada), repete:'',
          serieId:serie, parcela:k, totalParcelas:nParc, periodicidade:cada }, comum));
      }
      toast(nParc + ' parcelas anotadas', true);
    }
    salvar(); fecharSheet(); render();
    return;
  }

  /* --- empréstimo cria metadado + movimento --- */
  if (d.tipo === 'emprestimo') {
    var pessoa = ((el('fPessoa')||{}).value || '').trim();
    var contaE = (el('fConta')||{}).value;
    if (!valor) erros.push('Informe o valor.');
    if (!pessoa) erros.push('Diga o nome da pessoa.');
    if (erros.length) return mostrar(erros);
    marcar();
    var eid = F.uid();
    D.emprestimos.push({
      id:eid, direcao:d.direcao, pessoa:pessoa, descricao:desc.trim(),
      prazo:(el('fPrazo')||{}).value || '', criadoEm:new Date().toISOString()
    });
    D.mov.push({
      id:F.uid(), tipo: d.direcao === 'concedido' ? 'emprestimo_concedido' : 'emprestimo_obtido',
      valor:valor, data:data, contaId:contaE, emprestimoId:eid,
      descricao: d.direcao === 'concedido' ? 'Emprestei para ' + pessoa : 'Peguei com ' + pessoa,
      obs:desc.trim(), criadoEm:new Date().toISOString()
    });
    if (contaE) D.config.ultimaConta = contaE;
    salvar(); fecharSheet();
    toast(d.direcao === 'concedido' ? 'Empréstimo registrado' : 'Dívida registrada', true);
    render();
    return;
  }

  /* --- despesa, receita, transferência --- */
  var m = { id: editando ? editando.id : F.uid(), valor:valor, data:data,
            descricao:desc.trim(), obs:obs.trim(), criadoEm: editando ? editando.criadoEm : new Date().toISOString() };

  if (d.tipo === 'despesa') {
    m.tipo = 'despesa';
    m.categoria = d.categoria;
    if (d.cartaoId) { m.cartaoId = d.cartaoId; m.parcelas = d.parcelas; m.contaId = ''; }
    else { m.contaId = d.contaId; m.forma = (el('fForma')||{}).value || ''; }
    if (!d.categoria) erros.push('Escolha uma categoria.');
  } else if (d.tipo === 'receita') {
    m.tipo = 'receita'; m.contaId = d.contaId; m.categoria = d.categoria;
    if (!d.categoria) erros.push('Escolha uma categoria.');
  } else {
    m.tipo = 'transferencia';
    m.contaOrigemId = d.contaOrigemId; m.contaDestinoId = d.contaDestinoId;
  }

  erros = erros.concat(F.validarMov(m));
  if (erros.length) return mostrar(erros);

  marcar();
  if (editando) {
    for (var i=0;i<D.mov.length;i++) if (D.mov[i].id === editando.id) D.mov[i] = m;
  } else {
    D.mov.push(m);
  }
  if (m.contaId) D.config.ultimaConta = m.contaId;
  salvar(); fecharSheet();
  toast(editando ? 'Lançamento atualizado' : 'Registrado', true);
  render();
}



/* =============================================================
   DETALHES
   ============================================================= */
function detalheMov(id){
  var m = F.getDB().mov.filter(function(x){ return x.id === id; })[0];
  if (!m) return;
  var info = descreveMov(m);
  var editavel = ['despesa','receita','transferencia'].indexOf(m.tipo) >= 0;
  var impedimentos = F.impedimentosParaApagar(m);

  var extra = '';
  if (m.tipo === 'despesa' && m.cartaoId) {
    var ps = F.parcelasDaCompra(m);
    extra = '<div class="field"><label>Parcelas</label><div class="rows">' +
      ps.map(function(p){
        var f = F.fatura(m.cartaoId, p.competencia);
        return '<div class="row"><span class="row-mid"><span class="row-t">' + p.numero + ' de ' + p.total + '</span>' +
          '<span class="row-s">fatura de ' + F.mesLabel(p.competencia) +
            (f.quitada ? ' · paga' : '') + '</span></span>' +
          '<span class="row-v num">' + fmt(p.valor) + '</span></div>';
      }).join('') + '</div></div>';
  }

  abrirSheet(
    '<div class="sheet-head"><h2>' + esc(info.titulo) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="hero-v num" style="font-size:30px;margin:10px 0 2px;color:' + info.corValor + '">' +
      info.sinal + fmt(m.valor) + '</div>' +
    '<div class="hint">' + esc(info.sub) + '</div>' +
    '<div style="margin-top:14px">' +
      '<div class="kv"><span class="k">Data</span><span class="v">' + F.dataCurta(m.data) + '</span></div>' +
      (m.forma ? '<div class="kv"><span class="k">Forma</span><span class="v">' + esc(m.forma) + '</span></div>' : '') +
      (m.categoria ? '<div class="kv"><span class="k">Categoria</span><span class="v">' + esc(m.categoria) + '</span></div>' : '') +
    '</div>' +
    (m.obs ? '<div class="field"><label>Anotação</label><div style="background:var(--surface-2);border:1px solid var(--line);' +
      'border-radius:var(--r);padding:12px;font-size:14px;white-space:pre-wrap">' + esc(m.obs) + '</div></div>' : '') +
    extra +
    (impedimentos.length ? '<div class="note note-neg">' + impedimentos.map(esc).join('<br>') + '</div>' : '') +
    (!editavel ? '<div class="note note-mut">Este lançamento faz parte de um empréstimo, fatura ou reposição. ' +
      'Apague por lá para os dois lados não ficarem fora de sincronia.</div>' : '') +
    '<div class="sheet-actions">' +
      '<button class="btn btn-danger" data-act="mov-apagar" data-id="' + m.id + '"' +
        (impedimentos.length ? ' disabled' : '') + '>' + ico('trash') + ' Apagar</button>' +
      (editavel ? '<button class="btn btn-ghost" data-act="mov-duplicar" data-id="' + m.id + '">Duplicar</button>' +
        '<button class="btn btn-primary" data-act="mov-editar" data-id="' + m.id + '">' + ico('edit') + ' Editar</button>' : '') +
    '</div>'
  );
}

function detalheEmprestimo(id){
  var e = F.emprestimo(id);
  if (!e) return;
  var movs = F.movsDoEmprestimo(id).sort(ordemMov);
  var saldo = F.saldoEmprestimo(e);
  var principal = movs.filter(function(m){ return m.tipo==='emprestimo_concedido'||m.tipo==='emprestimo_obtido'; })
    .reduce(function(s,m){ return s+m.valor; },0);
  var conc = e.direcao === 'concedido';

  abrirSheet(
    '<div class="sheet-head"><h2>' + esc(e.pessoa) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="hint">' + (conc ? 'Emprestei para essa pessoa' : 'Peguei emprestado com essa pessoa') + '</div>' +
    '<div class="hero-v num" style="font-size:30px;margin:10px 0 2px;color:' +
      (saldo ? (conc?'var(--rec)':'var(--neg)') : 'var(--pos)') + '">' + fmt(saldo) + '</div>' +
    '<div class="hint">' + (saldo ? (conc ? 'ainda a receber' : 'ainda a pagar') : 'quitado') + ' · de ' + fmt(principal) + '</div>' +
    (principal ? '<div class="bar" style="margin-top:12px;height:9px"><span style="width:' +
      Math.min(100,(principal-saldo)/principal*100).toFixed(1) + '%;background:' + (conc?'var(--rec)':'var(--neg)') + '"></span></div>' : '') +
    '<div style="margin-top:14px">' +
      (e.descricao ? '<div class="kv"><span class="k">Motivo</span><span class="v">' + esc(e.descricao) + '</span></div>' : '') +
      (e.prazo ? '<div class="kv"><span class="k">Prazo combinado</span><span class="v">' + F.dataCurta(e.prazo) +
        (saldo && e.prazo < F.hojeISO() ? ' · atrasado' : '') + '</span></div>' : '') +
    '</div>' +
    '<div class="field"><label>Movimentos</label><div class="rows">' +
      movs.map(function(m){ return rowMov(m, true); }).join('') + '</div></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-danger" style="flex:0 0 52px" data-act="emp-apagar" data-id="' + e.id + '" aria-label="Apagar">' + ico('trash') + '</button>' +
      (saldo && conc ? '<button class="btn btn-ghost" data-act="emp-perda" data-id="' + e.id + '">Dar como perdido</button>' : '') +
      (saldo ? '<button class="btn btn-primary" data-act="emp-baixa" data-id="' + e.id + '">' + ico('check') + ' ' +
        (conc ? 'Recebi' : 'Paguei') + '</button>' : '') +
    '</div>'
  );
}

function detalhePrevisto(id){
  var p = F.getDB().previstos.filter(function(x){ return x.id === id; })[0];
  if (!p) return;
  var dias = F.diasEntre(F.hojeISO(), p.vencimento);
  abrirSheet(
    '<div class="sheet-head"><h2>' + esc(p.descricao || p.categoria) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="hero-v num" style="font-size:30px;margin:10px 0 2px;color:' +
      (p.tipo==='receita'?'var(--pos)':'var(--com)') + '">' + fmt(p.valor) + '</div>' +
    '<div class="hint">' + (p.tipo==='receita'?'receita prevista':'despesa prevista') + ' · vence ' + F.dataCurta(p.vencimento) +
      (dias < 0 ? ' (atrasada)' : '') + '</div>' +
    '<div style="margin-top:14px">' +
      '<div class="kv"><span class="k">Categoria</span><span class="v">' + esc(p.categoria||'—') + '</span></div>' +
      (p.repete==='mensal' ? '<div class="kv"><span class="k">Repetição</span><span class="v">todo mês</span></div>' : '') +
      (p.totalParcelas > 1 ? serieDoPrevisto(p) : '') +
    '</div>' +
    '<div class="note note-mut">Ainda não aconteceu: não entra nas despesas, só no comprometido.</div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-danger" style="flex:0 0 52px" data-act="prev-apagar" data-id="' + p.id + '" aria-label="Apagar">' + ico('trash') + '</button>' +
      '<button class="btn btn-primary" data-act="prev-confirmar" data-id="' + p.id + '">' + ico('check') + ' Já ' +
        (p.tipo==='receita'?'recebi':'paguei') + '</button>' +
    '</div>'
  );
}

function detalheMeta(id){
  var m = F.meta(id);
  if (!m) return;
  var p = F.metaProgresso(m);
  var vinc = F.metaVinculada(m);
  var cs = F.contasDaMeta(m);

  var corpo = vinc
    ? '<div class="field"><label>Contas que formam esta meta</label><div class="rows">' +
        cs.map(function(c){
          return '<button class="row" data-act="conta-abrir" data-id="' + c.id + '">' +
            '<span class="row-ic" style="background:' + (c.cor||'var(--rec)') + '">' + esc(iniciais(c.nome)) + '</span>' +
            '<span class="row-mid"><span class="row-t">' + esc(c.nome) + '</span>' +
            '<span class="row-s">' + c.tipo + '</span></span>' +
            '<span class="row-v num">' + fmt(F.saldoConta(c)) + '</span></button>';
        }).join('') + '</div>' +
        '<div class="hint">O saldo dessas contas <b>é</b> a meta. O que entrar ou sair conta sozinho.</div></div>'
    : '<div class="field"><label>Reservas manuais</label>' +
        ((m.aportes||[]).length
          ? '<div class="rows">' + m.aportes.slice().sort(function(a,b){ return String(b.data).localeCompare(String(a.data)); })
              .map(function(a){
                return '<div class="row"><span class="row-mid"><span class="row-t">' +
                  (a.retirada?'− ':'+ ') + fmt(a.valor) + '</span>' +
                  '<span class="row-s">' + F.dataCurta(a.data) + (a.obs ? ' · ' + esc(a.obs) : '') + '</span></span>' +
                  '<button class="iconbtn" style="border:0;background:none;width:32px;height:32px" ' +
                    'data-act="meta-aporte-apagar" data-id="' + m.id + '" data-id2="' + a.id + '" aria-label="Remover">' + ico('trash') + '</button></div>';
              }).join('') + '</div>'
          : '<p class="hint" style="margin:0">Nada reservado ainda.</p>') + '</div>';

  abrirSheet(
    '<div class="sheet-head"><h2>' + esc(m.nome) + '</h2>' +
      '<button class="iconbtn" data-act="meta-editar" data-id="' + m.id + '" aria-label="Editar">' + ico('edit') + '</button>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="hero-v num res" style="font-size:30px;margin:10px 0 2px">' + fmt(p.acumulado) + '</div>' +
    '<div class="hint">' + (p.semAlvo ? 'sem valor definido' : 'de ' + fmt(p.alvo)) + '</div>' +
    (p.semAlvo ? '' : '<div class="bar" style="margin-top:12px;height:10px"><span style="width:' + p.percentual.toFixed(1) +
      '%;background:' + (p.concluida?'var(--pos)':'var(--res)') + '"></span></div>') +
    '<div style="margin-top:14px">' +
      (m.descricao ? '<div class="kv"><span class="k">Descrição</span><span class="v">' + esc(m.descricao) + '</span></div>' : '') +
      (p.semAlvo ? '' : '<div class="kv"><span class="k">' + (p.falta?'Falta':'Situação') + '</span>' +
        '<span class="v num">' + (p.falta ? fmt(p.falta) : 'alcançada') + '</span></div>') +
      (m.prazo ? '<div class="kv"><span class="k">Prazo</span><span class="v">' + F.dataCurta(m.prazo) +
        (p.mesesRestantes ? ' · ' + p.mesesRestantes + ' mês(es)' : '') + '</span></div>' : '') +
      (p.porMes ? '<div class="kv"><span class="k">Para chegar no prazo</span><span class="v num res">' +
        fmt(p.porMes) + ' por mês</span></div>' : '') +
    '</div>' + corpo +
    '<div class="sheet-actions">' +
      '<button class="btn btn-danger" style="flex:0 0 52px" data-act="meta-apagar" data-id="' + m.id + '" aria-label="Apagar">' + ico('trash') + '</button>' +
      '<button class="btn btn-ghost" data-act="meta-vincular" data-id="' + m.id + '">' + ico('conta') + ' Contas</button>' +
      (vinc
        ? '<button class="btn btn-primary" data-act="novo-transferencia" data-id2="' + (cs[0]?cs[0].id:'') + '">' +
          ico('swap') + ' Transferir</button>'
        : '<button class="btn btn-primary" data-act="meta-aporte" data-id="' + m.id + '">' + ico('plus') + ' Reservar</button>') +
    '</div>'
  );
}

/* =============================================================
   FORMULÁRIOS SECUNDÁRIOS
   ============================================================= */
function formConta(c){
  var d = c ? { nome:c.nome, tipo:c.tipo, saldoInicial:c.saldoInicial, acompanhar:F.acompanhaNivel(c) }
            : { nome:'', tipo:'corrente', saldoInicial:0, acompanhar:false };
  abrirSheet(
    '<div class="sheet-head"><h2>' + (c?'Editar conta':'Nova conta') + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="field"><label for="cNome">Nome</label>' +
      '<input class="input" id="cNome" data-autofocus placeholder="Ex.: Bradesco, Nubank, MercadoPago" value="' + esc(d.nome) + '"></div>' +
    '<div class="field"><label>Para que serve</label>' +
      '<div class="seg" id="cTipo">' +
        '<button type="button" data-v="corrente" aria-pressed="' + (d.tipo==='corrente') + '">Dia a dia</button>' +
        '<button type="button" data-v="reserva" aria-pressed="' + (d.tipo==='reserva') + '">Reserva</button>' +
        '<button type="button" data-v="investimento" aria-pressed="' + (d.tipo==='investimento') + '">Investimento</button>' +
      '</div><div class="hint" id="cHint"></div></div>' +
    '<div class="field"><label for="cSaldo">' + (c?'Saldo inicial cadastrado':'Saldo que a conta tem hoje') + '</label>' +
      '<input class="input money" id="cSaldo" inputmode="numeric" placeholder="0,00" value="' +
        (d.saldoInicial ? fmt(d.saldoInicial,{nosymbol:true}) : '') + '">' +
      '<div class="hint">Ponto de partida. As movimentações que você registrar entram em cima dele — esse valor nunca é contado como receita.</div></div>' +
    '<div class="field" id="cRefWrap">' +
      '<label class="check" style="margin-top:0"><input type="checkbox" id="cNivel"' + (d.acompanhar?' checked':'') + '>' +
        '<span><b>Acompanhar o patamar desta conta.</b> O app guarda sozinho o maior saldo que ela já teve. ' +
        'Se sair dinheiro, a diferença aparece em “A repor” — sem você digitar valor nenhum. ' +
        'Se entrar acima do patamar, o nível sobe e o buraco fecha.</span></label>' +
      (c ? '<div class="hint" id="cNivelInfo"></div>' : '') + '</div>' +
    '<div class="sheet-actions">' +
      (c ? '<button class="btn btn-danger" style="flex:0 0 52px" data-act="conta-apagar" data-id="' + c.id + '" aria-label="Apagar">' + ico('trash') + '</button>'
         : '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>') +
      '<button class="btn btn-primary" id="btnConta">' + (c?'Salvar':'Criar conta') + '</button>' +
    '</div>',
    function(){
      ligarMoeda(el('cSaldo'));
      var info = el('cNivelInfo');
      if (info && c) {
        var nv = F.nivelConta(c);
        info.innerHTML = 'Hoje: patamar <b>' + fmt(nv.nivel) + '</b>, saldo <b>' + fmt(nv.saldo) + '</b>' +
          (nv.falta ? ', falta repor <b>' + fmt(nv.falta) + '</b>.' : '.');
      }
      function pinta(){
        el('cRefWrap').style.display = d.tipo === 'corrente' && !d.acompanhar ? 'none' : '';
        el('cHint').textContent = d.tipo === 'reserva'
          ? 'Cofrinho. Tirar dinheiro daqui gera lembrete de reposição.'
          : d.tipo === 'investimento' ? 'Onde o dinheiro fica rendendo.'
          : 'Onde entra salário e saem os gastos.';
      }
      el('cTipo').addEventListener('click', function(ev){
        var b = ev.target.closest('button[data-v]'); if (!b) return;
        d.tipo = b.getAttribute('data-v');
        Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){
          x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === d.tipo));
        });
        if (!c) { d.acompanhar = d.tipo !== 'corrente'; el('cNivel').checked = d.acompanhar; }
        pinta();
      });
      el('cNivel').addEventListener('change', function(){ d.acompanhar = this.checked; });
      if (!c) { d.acompanhar = d.tipo !== 'corrente'; el('cNivel').checked = d.acompanhar; }
      pinta();
      el('btnConta').addEventListener('click', function(){
        var nome = el('cNome').value.trim();
        if (!nome) { toast('Dê um nome para a conta'); return; }
        marcar();
        var dados = { nome:nome, tipo:d.tipo, saldoInicial:F.digitsToCents(el('cSaldo').value),
                      acompanharNivel: !!el('cNivel').checked };
        if (c) Object.assign(c, dados);
        else F.getDB().contas.push(Object.assign({ id:F.uid(), cor:F.PAL[F.getDB().contas.length % F.PAL.length],
          arquivada:false, dataInicial:F.hojeISO(), nivelReset:null, referencia:0 }, dados));
        salvar(); fecharSheet(); toast(c?'Conta atualizada':'Conta criada', true); render();
      });
    }
  );
}

function formCartao(c){
  var D = F.getDB();
  var d = c ? { nome:c.nome, contaPagamentoId:c.contaPagamentoId, limite:c.limite,
                diaFechamento:c.diaFechamento, diaVencimento:c.diaVencimento }
            : { nome:'', contaPagamentoId:(contaPadrao()||{}).id, limite:0, diaFechamento:20, diaVencimento:27 };
  function dias(sel){
    var o = '';
    for (var i=1;i<=28;i++) o += '<option value="' + i + '"' + (sel===i?' selected':'') + '>dia ' + i + '</option>';
    return o;
  }
  abrirSheet(
    '<div class="sheet-head"><h2>' + (c?'Editar cartão':'Novo cartão') + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="field"><label for="kNome">Nome</label>' +
      '<input class="input" id="kNome" data-autofocus placeholder="Ex.: Nubank, Itaú Visa" value="' + esc(d.nome) + '"></div>' +
    '<div class="row-2">' +
      '<div class="field"><label for="kFech">Fecha no</label><select class="input" id="kFech">' + dias(d.diaFechamento) + '</select></div>' +
      '<div class="field"><label for="kVenc">Vence no</label><select class="input" id="kVenc">' + dias(d.diaVencimento) + '</select></div>' +
    '</div>' +
    '<div class="field"><label for="kConta">Conta que paga a fatura</label>' +
      '<select class="input" id="kConta">' + opcoesConta(d.contaPagamentoId) + '</select></div>' +
    '<div class="field"><label for="kLimite">Limite <span class="mut">— opcional</span></label>' +
      '<input class="input money" id="kLimite" inputmode="numeric" placeholder="0,00" value="' +
        (d.limite ? fmt(d.limite,{nosymbol:true}) : '') + '"></div>' +
    '<div class="note note-mut" id="kPreview"></div>' +
    '<div class="sheet-actions">' +
      (c ? '<button class="btn btn-danger" style="flex:0 0 52px" data-act="cartao-apagar" data-id="' + c.id + '" aria-label="Apagar">' + ico('trash') + '</button>'
         : '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>') +
      '<button class="btn btn-primary" id="btnCartao">' + (c?'Salvar':'Criar cartão') + '</button>' +
    '</div>',
    function(){
      ligarMoeda(el('kLimite'));
      function preview(){
        var fe = parseInt(el('kFech').value,10), ve = parseInt(el('kVenc').value,10);
        var falso = { diaFechamento:fe, diaVencimento:ve };
        var comp = F.competenciaDaCompra(falso, F.hojeISO());
        el('kPreview').innerHTML = 'Uma compra feita hoje cai na fatura de <b>' + F.mesLabel(comp) +
          '</b>, que vence em <b>' + F.dataCurta(F.vencimentoFatura(falso, comp)) + '</b>.';
      }
      el('kFech').addEventListener('change', preview);
      el('kVenc').addEventListener('change', preview);
      preview();
      el('btnCartao').addEventListener('click', function(){
        var nome = el('kNome').value.trim();
        if (!nome) { toast('Dê um nome para o cartão'); return; }
        marcar();
        var dados = { nome:nome, contaPagamentoId:el('kConta').value, limite:F.digitsToCents(el('kLimite').value),
          diaFechamento:parseInt(el('kFech').value,10), diaVencimento:parseInt(el('kVenc').value,10) };
        if (c) Object.assign(c, dados);
        else D.cartoes.push(Object.assign({ id:F.uid(), cor:F.PAL[(D.cartoes.length+5) % F.PAL.length] }, dados));
        salvar(); fecharSheet(); toast(c?'Cartão atualizado':'Cartão criado', true); render();
      });
    }
  );
}

function formPagarFatura(cartaoId, comp){
  var c = F.cartao(cartaoId);
  var f = F.fatura(cartaoId, comp);
  if (!c || !f) return;
  abrirSheet(
    '<div class="sheet-head"><h2>Pagar fatura ' + esc(c.nome) + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="hint" style="margin-top:6px">Fatura de ' + F.mesLabel(comp) + ' · vence ' + F.dataCurta(f.vencimento) +
      ' · em aberto ' + fmt(f.aberto) + '</div>' +
    '<div class="field"><label for="pgValor">Valor pago</label>' +
      '<input class="input money" id="pgValor" inputmode="numeric" data-autofocus value="' + fmt(f.aberto,{nosymbol:true}) + '"></div>' +
    '<div class="field"><label for="pgConta">De qual conta sai o dinheiro</label>' +
      '<select class="input" id="pgConta">' + opcoesConta(c.contaPagamentoId) + '</select></div>' +
    '<div class="field"><label for="pgData">Data</label>' +
      '<input class="input" type="date" id="pgData" value="' + F.hojeISO() + '"></div>' +
    '<div class="erros" id="erros"></div>' +
    '<div class="note note-mut" id="pgResumo"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>' +
      '<button class="btn btn-primary" id="btnPagar">Registrar pagamento</button>' +
    '</div>',
    function(){
      function resumo(){
        var v = F.digitsToCents(el('pgValor').value);
        var cc = F.conta(el('pgConta').value);
        var sobra = Math.max(0, f.aberto - v);
        el('pgResumo').innerHTML = cc
          ? '<b>' + fmt(v) + ' saem de ' + esc(cc.nome) + '</b>, que vai de ' + fmt(F.saldoConta(cc)) +
            ' para <b>' + fmt(F.saldoConta(cc) - v) + '</b>. ' +
            (sobra ? 'Sobram ' + fmt(sobra) + ' em aberto nesta fatura.' : 'A fatura fica quitada.') +
            '<br><br>Isso <b>não</b> é um gasto novo: as compras já contaram no mês de cada parcela. ' +
            'O pagamento só liquida a obrigação, por isso seu disponível não muda.'
          : 'Escolha a conta que vai pagar.';
      }
      ligarMoeda(el('pgValor'), resumo);
      el('pgConta').addEventListener('change', resumo);
      resumo();
      el('btnPagar').addEventListener('click', function(){
        var m = { id:F.uid(), tipo:'pagamento_fatura', valor:F.digitsToCents(el('pgValor').value),
          data:el('pgData').value || F.hojeISO(), contaId:el('pgConta').value,
          cartaoId:cartaoId, competencia:comp, descricao:'Fatura ' + c.nome,
          criadoEm:new Date().toISOString() };
        var erros = F.validarMov(m);
        if (erros.length) {
          el('erros').innerHTML = '<ul>' + erros.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>';

function formMeta(m){
  var D = F.getDB();
  var d = m ? { nome:m.nome, descricao:m.descricao||'', alvo:m.alvo, prazo:m.prazo||'',
                contas:(m.contasVinculadas||[]).slice(), incluirAReceber:!!m.incluirAReceber }
            : { nome:'', descricao:'', alvo:0, prazo:'', contas:[],
                incluirAReceber: !D.metas.some(function(x){ return x.incluirAReceber; }) };
  function grid(){
    return D.contas.map(function(c){
      var dona = F.metaDaConta(c.id);
      var minha = m && dona && dona.id === m.id;
      var ocupada = dona && !minha;
      return '<button type="button" class="catbtn" data-conta="' + esc(c.id) + '"' +
        (ocupada ? ' disabled style="opacity:.45"' : '') +
        ' aria-pressed="' + (d.contas.indexOf(c.id) >= 0) + '">' +
        '<span class="sw" style="background:' + (c.cor||'#888') + '"></span>' +
        '<span>' + esc(c.nome) + '<br><span class="mut" style="font-size:11px;font-weight:500">' +
        (ocupada ? 'da meta ' + esc(dona.nome) : fmt(F.saldoConta(c))) + '</span></span></button>';
    }).join('');
  }
  abrirSheet(
    '<div class="sheet-head"><h2>' + (m?'Editar meta':'Nova meta') + '</h2>' +
      '<button class="iconbtn" data-act="fechar" aria-label="Fechar">' + ico('close') + '</button></div>' +
    '<div class="field"><label for="mNome">O que você quer conquistar</label>' +
      '<input class="input" id="mNome" data-autofocus placeholder="Ex.: juntar 75 mil" value="' + esc(d.nome) + '"></div>' +
    '<div class="field"><label for="mAlvo">Quanto precisa juntar <span class="mut">— deixe vazio para só acumular</span></label>' +
      '<input class="input money" id="mAlvo" inputmode="numeric" placeholder="0,00" value="' +
        (d.alvo ? fmt(d.alvo,{nosymbol:true}) : '') + '"></div>' +
    '<div class="field"><label for="mPrazo">Para quando</label>' +
      '<input class="input" type="date" id="mPrazo" value="' + esc(d.prazo) + '">' +
      '<div class="hint" id="mCalc"></div></div>' +
    (D.contas.length
      ? '<div class="field"><label>Onde esse dinheiro fica</label>' +
        '<div class="catgrid" id="mContas">' + grid() + '</div>' +
        '<div class="hint" id="mHint"></div></div>' : '') +
    '<label class="check"><input type="checkbox" id="mReceber"' + (d.incluirAReceber?' checked':'') + '>' +
      '<span><b>Contar o que tenho a receber nesta meta.</b> Mostra em roxo onde a meta chegaria se todo mundo ' +
      'te pagasse. É só projeção: esse dinheiro não entra no patrimônio nem no disponível. ' +
      'Só uma meta por vez pode contar.</span></label>' +
    '<div class="field"><label for="mDesc">Descrição <span class="mut">— opcional</span></label>' +
      '<textarea class="input" id="mDesc">' + esc(d.descricao) + '</textarea></div>' +
    '<div class="sheet-actions">' +
      (m ? '<button class="btn btn-danger" style="flex:0 0 52px" data-act="meta-apagar" data-id="' + m.id + '" aria-label="Apagar">' + ico('trash') + '</button>'
         : '<button class="btn btn-ghost" data-act="fechar">Cancelar</button>') +
      '<button class="btn btn-primary" id="btnMeta">' + (m?'Salvar':'Criar meta') + '</button>' +
    '</div>',
    function(){
      ligarMoeda(el('mAlvo'), atualiza);
      el('mPrazo').addEventListener('change', atualiza);
      var g = el('mContas');
      if (g) g.addEventListener('click', function(ev){
        var b = ev.target.closest('button[data-conta]');
        if (!b || b.disabled) return;
        var id = b.getAttribute('data-conta');
        var i = d.contas.indexOf(id);
        if (i >= 0) d.contas.splice(i,1); else d.contas.push(id);
        b.setAttribute('aria-pressed', String(i < 0));
        atualiza();
      });
      atualiza();
      function atualiza(){
        var alvo = F.digitsToCents(el('mAlvo').value);
        var acc = d.contas.reduce(function(s,id){ var c = F.conta(id); return c ? s + F.saldoConta(c) : s; }, 0);
        var h = el('mHint');
        if (h) {
          h.innerHTML = d.contas.length
            ? 'A meta passa a valer o saldo dessas contas: <b>' + fmt(acc) + '</b> hoje. Tudo que entrar ou sair conta sozinho.' +
              (m && (m.aportes||[]).length ? ' <b>As reservas manuais desta meta deixam de ser somadas.</b>' : '')
            : 'Sem conta escolhida, a meta é manual: você reserva valores avulsos quando quiser.';
        }
        var calc = el('mCalc');
        if (alvo && el('mPrazo').value) {
          var dias = F.diasEntre(F.hojeISO(), el('mPrazo').value);
          if (dias <= 0) calc.textContent = 'Escolha uma data no futuro.';
          else {
            var meses = Math.max(1, Math.ceil(dias/30));
            calc.innerHTML = 'São <b>' + meses + ' mes' + (meses===1?'':'es') + '</b>: guarde cerca de <b>' +
              fmt(Math.ceil(Math.max(0, alvo-acc)/meses)) + ' por mês</b>.';
          }
        } else calc.textContent = 'Com uma data, o app calcula quanto guardar por mês.';
      }
      el('btnMeta').addEventListener('click', function(){
        var nome = el('mNome').value.trim();
        if (!nome) { toast('Dê um nome para a meta'); return; }
        marcar();
        var querReceber = !!el('mReceber').checked;
        var dados = { nome:nome, descricao:el('mDesc').value.trim(), alvo:F.digitsToCents(el('mAlvo').value),
          prazo:el('mPrazo').value, contasVinculadas:d.contas.slice(), incluirAReceber:querReceber };
        /* a projeção vale para uma meta só, senão o mesmo dinheiro apareceria duas vezes */
        if (querReceber) D.metas.forEach(function(x){ if (!m || x.id !== m.id) x.incluirAReceber = false; });
        if (m) Object.assign(m, dados);
        else D.metas.push(Object.assign({ id:F.uid(), aportes:[], criadaEm:new Date().toISOString() }, dados));
        salvar(); fecharSheet(); irPara('metas'); toast(m?'Meta atualizada':'Meta criada', true);
      });
    }
  );
}

    '<button class="btn btn-primary btn-block" style="margin-top:10px" id="btnCat">' + ico('plus') + ' Criar</button>' +
